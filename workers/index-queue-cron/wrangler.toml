name = "gnlaw-index-queue-cron"
main = "src/index.js"
compatibility_date = "2026-05-25"

# 15분마다 색인 큐 스캔을 트리거한다. 실제 작업(사건 목록 조회 · 라이브 점검 ·
# 큐 등록 · 네이버 IndexNow 제출)은 전부 gnlaw-criminal.co.kr의
# functions/api/index-queue.js(action: "scan")가 처리한다 — 이 워커는 그걸
# 주기적으로 호출만 하는 얇은 트리거다. Cloudflare Pages 프로젝트는 Cron
# Trigger를 직접 지원하지 않아 별도 Worker로 분리했다.
[triggers]
crons = ["*/15 * * * *"]
