<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>형사 사이트 게시판 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:30px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:#fff;border:1px solid #e1e6ef;border-radius:10px;padding:20px;box-shadow:0 3px 16px rgba(0,0,0,.05)}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 14px}label{display:block;font-size:13px;font-weight:800;margin:13px 0 6px;color:#4b5a70}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfd8e6;border-radius:7px;font:inherit}textarea{min-height:320px;line-height:1.65;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border:0;border-radius:7px;background:#123d58;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.btn.sec{background:#4b5a70}.btn.danger{background:#b52a2a}.btn:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.list{display:grid;gap:8px;max-height:760px;overflow:auto}.item{padding:12px;border:1px solid #e1e6ef;border-radius:8px;cursor:pointer}.item:hover{border-color:#123d58;background:#f7fafc}.item strong,.item span{display:block}.item span{font-size:12px;color:#748196;margin-top:4px}.msg{margin-top:12px;font-size:13px;font-weight:800}.ok{color:#16723a}.err{color:#b52a2a}.hint{font-size:12px;color:#748196}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><h1>형사 사이트 게시판 관리</h1><a class="btn sec" href="/admin/dashboard.html">관리자 대시보드</a></div>
<div class="grid"><section class="panel"><h2>게시글 작성 / 수정</h2>
<form id="form"><input type="hidden" id="originalSlug">
<label>제목</label><input id="title" required placeholder="게시글 제목">
<div class="row"><div><label>카테고리</label><select id="category"><option>피해 대응</option><option>투자사기</option><option>가상자산 사기</option><option>부업사기</option><option>사건 진행</option><option>법률 정보</option></select></div><div><label>발행일</label><input id="publishedAt" type="date"></div></div>
<label>URL slug</label><input id="slug" placeholder="자동 생성 또는 직접 입력">
<label>SEO 제목</label><input id="seoTitle" placeholder="비워두면 게시글 제목 사용">
<label>메타 설명</label><textarea id="metaDescription" style="min-height:80px" placeholder="검색결과에 표시할 설명"></textarea>
<label>대표 이미지 URL</label><input id="thumbnailUrl" placeholder="https://... 또는 /assets/...">
<label>본문</label><textarea id="body" required placeholder="## 소제목&#10;&#10;본문을 입력하세요.&#10;&#10;- 목록"></textarea>
<div class="row"><label class="check"><input id="pinned" type="checkbox"> 상단 고정</label><div><label>상태</label><select id="status"><option value="published">공개</option><option value="draft">임시저장</option><option value="hidden">숨김</option></select></div></div>
<div class="actions"><button class="btn" id="saveBtn">저장</button><button class="btn sec" type="button" onclick="resetForm()">새 글</button><button class="btn danger" id="deleteBtn" type="button" onclick="deletePost()" disabled>삭제</button><a class="btn sec" id="openLink" href="/board/" target="_blank">공개 페이지</a></div><div id="msg" class="msg"></div></form></section>
<aside class="panel"><h2>게시글 목록 <span id="count" class="hint"></span></h2><input id="search" placeholder="제목·카테고리 검색" oninput="renderList()" style="margin-bottom:10px"><div id="list" class="list"></div></aside></div></div>
<script>
const API='/api/criminal-board';let posts=[];const $=id=>document.getElementById(id);
document.addEventListener('DOMContentLoaded',()=>{$('publishedAt').value=today();$('form').addEventListener('submit',savePost);$('title').addEventListener('input',()=>{if(!$('originalSlug').value&&!$('slug').value)$('slug').value=slugify($('title').value);updateLink()});$('slug').addEventListener('input',updateLink);loadPosts()});
async function loadPosts(){try{const r=await fetch(API);const d=await r.json();if(!d.ok)throw Error(d.message);posts=d.posts||[];renderList()}catch(e){show(e.message,false)}}
function renderList(){const q=$('search').value.trim().toLowerCase();const arr=posts.filter(p=>!q||`${p.title} ${p.category} ${p.slug}`.toLowerCase().includes(q));$('count').textContent=`${arr.length}건`;$('list').innerHTML=arr.length?arr.map(p=>`<div class="item" onclick="editPost('${escAttr(p.slug)}')"><strong>${esc(p.title||p.slug)}${p.pinned?' · 고정':''}${p.status!=='published'?' · 비공개':''}</strong><span>${esc(p.category||'')} · ${esc(p.publishedAt||'')}</span><span>${esc(p.excerpt||'')}</span></div>`).join(''):'<div class="hint">게시글이 없습니다.</div>'}
async function editPost(slug){const r=await fetch(`${API}?slug=${encodeURIComponent(slug)}`);const d=await r.json();if(!d.ok)return show(d.message,false);const p=d.post;$('originalSlug').value=p.slug||'';$('title').value=p.title||'';$('category').value=p.category||'피해 대응';$('publishedAt').value=p.publishedAt||today();$('slug').value=p.slug||'';$('seoTitle').value=p.seoTitle||'';$('metaDescription').value=p.metaDescription||'';$('thumbnailUrl').value=p.thumbnailUrl||'';$('body').value=p.body||'';$('pinned').checked=!!p.pinned;$('status').value=p.status||'published';$('deleteBtn').disabled=false;updateLink();show('게시글을 불러왔습니다.',true)}
async function savePost(e){e.preventDefault();$('saveBtn').disabled=true;try{const payload={originalSlug:$('originalSlug').value.trim(),title:$('title').value.trim(),category:$('category').value,slug:$('slug').value.trim(),publishedAt:$('publishedAt').value,seoTitle:$('seoTitle').value.trim(),metaDescription:$('metaDescription').value.trim(),thumbnailUrl:$('thumbnailUrl').value.trim(),body:$('body').value.trim(),pinned:$('pinned').checked,status:$('status').value};const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!d.ok)throw Error(d.message);$('originalSlug').value=d.post.slug;$('slug').value=d.post.slug;$('deleteBtn').disabled=false;updateLink();show('저장되었습니다.',true);await loadPosts()}catch(e){show(e.message,false)}finally{$('saveBtn').disabled=false}}
async function deletePost(){const slug=$('originalSlug').value;if(!slug||!confirm('이 게시글을 삭제하시겠습니까?'))return;const r=await fetch(`${API}?slug=${encodeURIComponent(slug)}`,{method:'DELETE'});const d=await r.json();if(!d.ok)return show(d.message,false);resetForm();show('삭제되었습니다.',true);loadPosts()}
function resetForm(){$('form').reset();$('originalSlug').value='';$('publishedAt').value=today();$('status').value='published';$('deleteBtn').disabled=true;updateLink()}
function updateLink(){const s=$('slug').value.trim();$('openLink').href=s?`/board/${encodeURIComponent(s)}/`:'/board/'}function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date())}function slugify(s){return s.trim().toLowerCase().replace(/[^a-z0-9가-힣]+/g,'-').replace(/^-|-$/g,'').slice(0,90)}function show(t,ok){$('msg').textContent=t;$('msg').className=`msg ${ok?'ok':'err'}`}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return String(s||'').replace(/['\\]/g,'')}
</script></body></html>
