<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파워링크 랜딩 생성</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fb;color:#172033}
    .wrap{max-width:1180px;margin:0 auto;padding:32px 20px 48px}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
    h1{margin:0 0 6px;font-size:25px;line-height:1.25}
    .meta{margin:0;color:#6b7a90;font-size:13px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;border:0;border-radius:7px;background:#1f4fd8;color:#fff;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer}
    .btn.sec{background:#263244}
    .btn.danger{background:#a83232}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
    form,.panel{background:#fff;border:1px solid #dde3ee;border-radius:8px;box-shadow:0 2px 18px rgba(15,23,42,.06)}
    form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field.wide{grid-column:1/-1}
    label{font-size:13px;font-weight:800;color:#4b5a70}
    input,textarea,select{width:100%;border:1px solid #cfd8e6;border-radius:7px;padding:11px 12px;font:inherit;background:#fff;color:#172033}
    textarea{min-height:150px;resize:vertical;line-height:1.6}
    #body{min-height:420px;font-family:Consolas,"Courier New",monospace;font-size:14px}
    .actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .message{grid-column:1/-1;margin:0;font-size:14px;white-space:pre-wrap}
    .message.ok{color:#14642d}
    .message.err{color:#a83232}
    .saved-link{grid-column:1/-1;display:none;padding:12px 14px;border-radius:7px;background:#edf7ed;color:#145b22;font-size:14px}
    .saved-link a{color:#0f4fcf;font-weight:800;text-decoration:none}
    .panel{padding:18px}
    .panel h2{margin:0 0 12px;font-size:17px}
    .list{display:flex;flex-direction:column;gap:10px}
    .empty{padding:18px;border:1px dashed #ccd5e2;border-radius:7px;color:#6b7a90;text-align:center}
    .item{padding:12px;border:1px solid #e0e6f0;border-radius:7px;background:#fbfcff}
    .item strong{display:block;margin-bottom:4px;font-size:14px;line-height:1.4}
    .item span{display:block;color:#6b7a90;font-size:12px}
    .item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
    .item-actions .btn{min-height:30px;padding:0 10px;font-size:12px}
    @media(max-width:900px){
      .grid{grid-template-columns:1fr}
      form{grid-template-columns:1fr}
      .top{flex-direction:column}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div>
        <h1>파워링크 랜딩 생성</h1>
        <p class="meta">gnlaw-criminal.co.kr 전용 수동 원고 랜딩</p>
      </div>
      <a class="btn sec" href="/admin/dashboard.html">관리자 대시보드</a>
    </div>

    <div class="grid">
      <form id="powerlinkForm">
        <div class="field">
          <label for="title">페이지 제목</label>
          <input id="title" name="title" type="text" placeholder="파워링크 랜딩 제목" required>
        </div>
        <div class="field">
          <label for="slug">URL slug</label>
          <input id="slug" name="slug" type="text" placeholder="제목 입력 시 자동 생성" required>
        </div>
        <div class="field">
          <label for="h1">H1</label>
          <input id="h1" name="h1" type="text" placeholder="제목 입력 시 자동 생성" required>
        </div>
        <div class="field">
          <label for="robots">검색엔진 설정</label>
          <select id="robots" name="robots">
            <option value="index, follow">index, follow</option>
            <option value="noindex, follow">noindex, follow</option>
          </select>
        </div>
        <div class="field wide">
          <label for="description">메타 설명</label>
          <textarea id="description" name="description" rows="3" placeholder="검색 결과와 공유 미리보기에 사용할 설명"></textarea>
        </div>
        <div class="field">
          <label for="imageAlt">이미지 alt</label>
          <input id="imageAlt" name="imageAlt" type="text" placeholder="이미지 대체 텍스트">
        </div>
        <div class="field">
          <label for="imageCaption">이미지 caption</label>
          <input id="imageCaption" name="imageCaption" type="text" placeholder="이미지 캡션">
        </div>
        <div class="field wide">
          <label for="imageDescription">이미지 description</label>
          <textarea id="imageDescription" name="imageDescription" rows="3" placeholder="이미지 설명"></textarea>
        </div>
        <div class="field wide">
          <label for="body">원고</label>
          <textarea id="body" name="body" placeholder="관리자가 작성한 원고를 입력하세요." required></textarea>
        </div>
        <div class="field">
          <label for="ctaTitle">CTA 제목</label>
          <input id="ctaTitle" name="ctaTitle" type="text" value="피해 자료 검토 요청">
        </div>
        <div class="field">
          <label for="ctaLabel">CTA 버튼</label>
          <input id="ctaLabel" name="ctaLabel" type="text" value="상담 접수">
        </div>
        <div class="field wide">
          <label for="ctaText">CTA 문구</label>
          <input id="ctaText" name="ctaText" type="text" value="입금 내역, 대화 캡처, 사이트 주소를 남겨주시면 담당자가 확인 후 연락드립니다.">
        </div>
        <div id="savedLink" class="saved-link"></div>
        <p id="message" class="message"></p>
        <div class="actions">
          <button id="submitButton" class="btn" type="submit">저장하기</button>
          <button id="resetButton" class="btn sec" type="button">새로 작성</button>
        </div>
      </form>

      <section class="panel">
        <h2>저장된 파워링크 랜딩</h2>
        <div id="list" class="list"><div class="empty">로딩 중...</div></div>
      </section>
    </div>
  </main>

  <script>
    const API_ORIGIN = location.protocol === "file:" ? "https://gnlaw-criminal.co.kr" : "";
    const DEFAULT_TITLE = "";
    const DEFAULT_SLUG = "";

    const form = document.getElementById("powerlinkForm");
    const titleEl = document.getElementById("title");
    const h1El = document.getElementById("h1");
    const slugEl = document.getElementById("slug");
    const messageEl = document.getElementById("message");
    const savedLinkEl = document.getElementById("savedLink");
    const submitButtonEl = document.getElementById("submitButton");
    const listEl = document.getElementById("list");
    let slugTouched = false;
    let h1Touched = false;

    titleEl.addEventListener("input", () => {
      if (!slugTouched) slugEl.value = slugFromTitle(titleEl.value);
      if (!h1Touched) h1El.value = titleEl.value;
    });

    slugEl.addEventListener("input", () => {
      slugTouched = true;
      slugEl.value = normalizeSlug(slugEl.value);
    });

    h1El.addEventListener("input", () => {
      h1Touched = true;
    });

    document.getElementById("resetButton").addEventListener("click", resetForm);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setMessage("저장 중...", "");
      savedLinkEl.style.display = "none";
      submitButtonEl.disabled = true;

      try {
        const payload = Object.fromEntries(new FormData(form).entries());
        payload.title = String(payload.title || "").trim();
        payload.slug = normalizeSlug(payload.slug || slugFromTitle(payload.title));
        payload.h1 = String(payload.h1 || payload.title || "").trim();
        const { data } = await fetchJson("/api/create-powerlink", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!data.ok) {
          setMessage(data.message || "저장 실패", "err");
          return;
        }

        setMessage(data.message, "ok");
        savedLinkEl.innerHTML = `공개 URL: <a href="${data.url}" target="_blank" rel="noopener">${data.url}</a>`;
        savedLinkEl.style.display = "block";
        await loadList();
      } catch (error) {
        setMessage("저장 오류: " + error.message, "err");
      } finally {
        submitButtonEl.disabled = false;
      }
    });

    async function loadList() {
      try {
        const { data } = await fetchJson("/api/get-powerlinks");
        if (!data.ok) throw new Error(data.message || "목록 로드 실패");
        renderList(data.landings || []);
      } catch (error) {
        listEl.innerHTML = `<div class="empty">목록 로드 오류: ${esc(error.message)}</div>`;
      }
    }

    function renderList(items) {
      if (!items.length) {
        listEl.innerHTML = '<div class="empty">저장된 랜딩이 없습니다.</div>';
        return;
      }

      listEl.innerHTML = items.map((item) => `
        <article class="item">
          <strong>${esc(item.title)}</strong>
          <span>${esc(item.slug)} · ${esc(item.updatedAt || item.createdAt || "")} · ${esc(item.robots || "")}</span>
          <div class="item-actions">
            <a class="btn" href="${item.url}" target="_blank" rel="noopener">보기</a>
            <button class="btn sec" type="button" data-edit="${escAttr(item.slug)}">불러오기</button>
            <button class="btn danger" type="button" data-delete="${escAttr(item.slug)}">삭제</button>
          </div>
        </article>`).join("");

      listEl.querySelectorAll("[data-edit]").forEach((button) => {
        button.addEventListener("click", () => loadLanding(button.dataset.edit));
      });
      listEl.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", () => deleteLanding(button.dataset.delete));
      });
    }

    async function loadLanding(slug) {
      try {
        const { data } = await fetchJson(`/api/get-powerlinks?slug=${encodeURIComponent(slug)}`);
        if (!data.ok) throw new Error(data.message || "불러오기 실패");
        const item = data.landing;
        titleEl.value = item.title || "";
        h1El.value = item.h1 || item.title || "";
        slugEl.value = item.slug || "";
        document.getElementById("description").value = item.description || "";
        document.getElementById("imageAlt").value = item.imageAlt || "";
        document.getElementById("imageCaption").value = item.imageCaption || "";
        document.getElementById("imageDescription").value = item.imageDescription || "";
        document.getElementById("body").value = item.body || "";
        document.getElementById("robots").value = item.robots || "index, follow";
        document.getElementById("ctaTitle").value = item.ctaTitle || "피해 자료 검토 요청";
        document.getElementById("ctaText").value = item.ctaText || "입금 내역, 대화 캡처, 사이트 주소를 남겨주시면 담당자가 확인 후 연락드립니다.";
        document.getElementById("ctaLabel").value = item.ctaLabel || "상담 접수";
        slugTouched = true;
        h1Touched = true;
        setMessage("불러왔습니다. 수정 후 저장하면 갱신됩니다.", "ok");
        savedLinkEl.style.display = "none";
      } catch (error) {
        setMessage("불러오기 오류: " + error.message, "err");
      }
    }

    async function deleteLanding(slug) {
      if (!confirm(`"${slug}" 파워링크 랜딩을 삭제하시겠습니까?`)) return;
      try {
        const { data } = await fetchJson("/api/delete-powerlink", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ slug }),
        });
        if (!data.ok) throw new Error(data.message || "삭제 실패");
        setMessage(data.message, "ok");
        await loadList();
      } catch (error) {
        setMessage("삭제 오류: " + error.message, "err");
      }
    }

    function resetForm() {
      form.reset();
      titleEl.value = DEFAULT_TITLE;
      h1El.value = DEFAULT_TITLE;
      slugEl.value = DEFAULT_SLUG;
      document.getElementById("imageAlt").value = "";
      document.getElementById("imageCaption").value = "";
      document.getElementById("imageDescription").value = "";
      document.getElementById("ctaTitle").value = "피해 자료 검토 요청";
      document.getElementById("ctaText").value = "입금 내역, 대화 캡처, 사이트 주소를 남겨주시면 담당자가 확인 후 연락드립니다.";
      document.getElementById("ctaLabel").value = "상담 접수";
      slugTouched = false;
      h1Touched = false;
      savedLinkEl.style.display = "none";
      setMessage("", "");
    }

    async function fetchJson(path, options = {}) {
      const res = await fetch(`${API_ORIGIN}${path}`, {
        ...options,
        credentials: API_ORIGIN ? "include" : "same-origin",
        headers: {
          Accept: "application/json",
          ...(options.headers || {}),
        },
      });
      const text = await res.text();
      let data = {};
      try {
        data = text ? JSON.parse(text) : {};
      } catch (error) {
        throw new Error(`JSON 응답이 아닙니다. (${res.status})`);
      }
      return { res, data };
    }

    function slugFromTitle(title) {
      return normalizeSlug(title);
    }

    function normalizeSlug(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[\u2013\u2014]/g, "-")
        .replace(/[^a-z0-9가-힣._-]+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .slice(0, 90);
    }

    function setMessage(text, type) {
      messageEl.textContent = text || "";
      messageEl.className = `message ${type || ""}`.trim();
    }

    function esc(value) {
      return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function escAttr(value) {
      return esc(value).replace(/"/g, "&quot;");
    }

    loadList().then(() => {
      const editSlug = new URLSearchParams(location.search).get("edit");
      if (editSlug) loadLanding(editSlug);
    });
  </script>
</body>
</html>
