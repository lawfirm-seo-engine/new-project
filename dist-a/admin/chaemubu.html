<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채무부존재소송 랜딩 대량 생성</title>
  <link rel="stylesheet" href="/admin/category-bulk.css?v=20260820-1">
</head>
<body>
  <main class="bulk-wrap">
    <header class="bulk-top">
      <div><h1>채무부존재소송 랜딩 생성</h1><p class="bulk-meta">투자사기대응센터.kr 전용 · 채무부존재소송 페이지를 한 번에 최대 30개 생성합니다.</p></div>
      <div class="bulk-top-actions"><a class="btn sec" href="/admin/dashboard.html">관리자 대시보드</a></div>
    </header>
    <section class="bulk-card">
      <div class="bulk-table-scroll"><table>
        <thead><tr><th style="width:48px">No.</th><th>페이지 제목</th><th style="width:250px">URL slug (선택)</th><th style="width:70px">생성</th><th style="width:220px">결과</th></tr></thead>
        <tbody id="bulkRows"></tbody>
      </table></div>
      <p class="bulk-help">제목만 입력하면 기존 채무부존재소송 전용 템플릿으로 원고와 메타 정보가 자동 생성됩니다.</p>
      <div class="bulk-actions">
        <button id="bulkCreateButton" class="btn" type="button" disabled>선택한 채무부존재소송 랜딩 대량 생성</button>
        <button id="bulkSelectAllButton" class="btn light" type="button">전체 선택</button><button id="bulkClearAllButton" class="btn light" type="button">전체 해제</button>
        <button id="bulkRefreshButton" class="btn sec" type="button">🔄 새로고침 (새 30개)</button><span id="bulkMessage" class="bulk-message"></span>
      </div>
      <div id="bulkProgress" class="progress"><div class="progress-track"><div id="bulkProgressBar" class="progress-bar"></div></div><span id="bulkProgressText" class="progress-text"></span></div>
    </section>
  </main>
  <script>window.CATEGORY_BULK_CONFIG={endpoint:"/api/create-chaemubu-landing",placeholder:"예: OO채무부존재소송변호사 채무 확인 어떻게 진행해야 할까",mode:"title"};</script>
  <script src="/admin/category-bulk.js?v=20260820-1"></script>
</body>
</html>
