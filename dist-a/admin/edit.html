<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사건 편집</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fb;color:#172033}
    .wrap{max-width:1000px;margin:0 auto;padding:28px 20px}
    h1{margin:0 0 4px;font-size:22px}
    .meta{color:#8a96a8;font-size:13px;margin:0 0 20px}
    .nav{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;height:38px;padding:0 16px;border:0;border-radius:7px;background:#1f4fd8;color:#fff;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
    .btn.sec{background:#263244}.btn.sm{height:32px;padding:0 12px;font-size:12px}
    .btn.danger{background:#c0392b}
    .card{background:#fff;border-radius:10px;padding:22px;margin-bottom:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
    .card h2{margin:0 0 14px;font-size:16px;color:#263244}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
    .tab{padding:7px 14px;border:1px solid #d7deea;border-radius:6px;background:#f0f4fa;color:#263244;font-size:13px;font-weight:700;cursor:pointer}
    .tab.active{background:#1f4fd8;color:#fff;border-color:#1f4fd8}
    label{display:block;margin-bottom:4px;font-size:13px;font-weight:700;color:#4b5a70}
    textarea,input[type=text]{width:100%;padding:10px 12px;border:1px solid #dde3ee;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical}
    textarea{min-height:100px}
    .field{margin-bottom:14px}
    .hint{font-size:12px;color:#8a96a8;margin:3px 0 0}
    .save-row{display:flex;align-items:center;gap:12px;margin-top:6px}
    .msg{font-size:13px;font-weight:700}
    .msg.ok{color:#16865f}.msg.err{color:#c0392b}
    .comment-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .comment-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid #e8edf4;border-radius:6px;background:#fafbfd}
    .comment-text{font-size:14px;flex:1}
    .comment-date{font-size:11px;color:#8a96a8;white-space:nowrap}
    .memo-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .memo-item{padding:10px 14px;border:1px solid #e8edf4;border-radius:6px;background:#fafbfd;position:relative}
    .memo-item:hover .memo-actions{opacity:1}
    .memo-actions{position:absolute;top:8px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
    .memo-btn{padding:2px 8px;border:0;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;line-height:1.6}
    .memo-btn.del{background:#ffe8e8;color:#c0392b}.memo-btn.edit{background:#edf3ff;color:#1f4fd8}
    .memo-text{font-size:14px;line-height:1.6;white-space:pre-wrap;padding-right:100px}
    .memo-date{margin-top:4px;font-size:11px;color:#8a96a8}
    .memo-edit-area{display:none;margin-top:8px}
    .memo-edit-area textarea{width:100%;border:1px solid #cfd8e6;border-radius:5px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical}
    .memo-edit-row{display:flex;gap:8px;margin-top:6px}
    .memo-edit-row button{padding:4px 12px;border:0;border-radius:5px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
    .memo-save-btn{background:#1f4fd8;color:#fff}.memo-cancel-btn{background:#e8edf4;color:#263244}
    .loading{color:#8a96a8;font-size:14px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a class="btn sec" href="/admin/dashboard.html">← 대시보드</a>
    <button class="btn sec" onclick="syncFromGithub()">GitHub→KV 즉시 반영</button>
  </div>
  <h1 id="pageTitle">사건 편집</h1>
  <p class="meta" id="slugLabel">로딩 중...</p>

  <!-- 기본 정보 편집 -->
  <div class="card">
    <h2>기본 정보</h2>
    <div class="field">
      <label>사건명 / 제목</label>
      <input type="text" id="fieldCaseName" placeholder="사건명을 입력하세요">
    </div>
    <div class="field">
      <label>요약 설명 (메타 description, 최대 300자)</label>
      <textarea id="fieldSummary" rows="3" placeholder="요약 설명을 입력하세요"></textarea>
    </div>
    <div class="save-row">
      <button class="btn" onclick="saveBasicInfo()">저장</button>
      <span class="msg" id="basicMsg"></span>
    </div>
  </div>

  <!-- 랜딩 본문 편집 -->
  <div class="card">
    <h2>랜딩 본문 편집</h2>
    <div class="tabs" id="groupTabs"></div>
    <div id="landingEditor" class="loading">로딩 중...</div>
    <div class="save-row">
      <button class="btn" onclick="saveLanding()">저장</button>
      <span class="msg" id="landingMsg"></span>
    </div>
  </div>

  <!-- 운영자 메모 -->
  <div class="card">
    <h2>운영자 메모</h2>
    <div id="memoList" class="memo-list loading">로딩 중...</div>
    <div class="field">
      <label>새 운영자 메모 추가</label>
      <textarea id="memoField" rows="4" placeholder="공개 페이지에 노출할 운영자 안내 메모를 입력하세요"></textarea>
    </div>
    <div class="save-row">
      <button class="btn" onclick="saveMemo()">메모 추가</button>
      <span class="msg" id="memoMsg"></span>
    </div>
  </div>

  <!-- 댓글 -->
  <div class="card">
    <h2>댓글 관리</h2>
    <div id="commentList" class="comment-list loading">로딩 중...</div>
    <div class="field">
      <label>새 댓글 추가</label>
      <textarea id="newComment" rows="3" placeholder="댓글 내용을 입력하세요"></textarea>
    </div>
    <div class="save-row">
      <button class="btn" onclick="addComment()">댓글 추가</button>
      <span class="msg" id="commentMsg"></span>
    </div>
  </div>
</div>

<script>
  const GROUPS = [
    { key: 'a',  label: 'A 형사고소' },
    { key: 'b',  label: 'B 민사소송' },
    { key: 'c',  label: 'C 성공사례/회수/지급정지' },
    { key: 'd',  label: 'D 사건정보' },
    { key: 'e',  label: 'E 전체허브' },
    { key: 'la', label: 'lA 보이스피싱' },
    { key: 'lc', label: 'lC 투자사기' },
    { key: 'ld', label: 'lD 리딩방' },
    { key: 'le', label: 'lE 채무부존재소송' },
  ];
  const FIELDS = [
    { key: 'h1',           label: 'H1 제목',                        multi: false },
    { key: 'title',        label: '페이지 제목 (title/ogTitle)',       multi: false },
    { key: 'description',  label: '메타 설명 (description/ogDesc)',   multi: false },
    { key: 'imageAlt',     label: '이미지 Alt',                      multi: false },
    { key: 'imageCaption', label: '이미지 Caption',                  multi: false },
    { key: 'imageDescription', label: '이미지 Description',           multi: false },
    { key: 'body',         label: '본문 / H2 제목 (## 제목 줄로 수정)', multi: true  },
    { key: 'currentProgress', label: '현재 진행 상황 (별도 단락)',      multi: true  },
    { key: 'victimCases',  label: '피해 사례 (줄바꿈으로 항목 구분)',    multi: true  },
  ];

  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  if (!slug) { document.body.innerHTML = '<p style="padding:40px;color:red">slug 파라미터가 없습니다.</p>'; }

  let caseData = null;
  let activeGroup = params.get('group') || 'a';

  fetch('/api/get-case?slug=' + encodeURIComponent(slug))
    .then(r => r.json())
    .then(data => {
      if (!data.ok) throw new Error(data.message || '로드 실패');
      caseData = data.case;
      if (!caseData) throw new Error('사건을 찾을 수 없습니다.');
      activeGroup = params.get('group') || defaultGroupForCase(caseData);
      document.getElementById('pageTitle').textContent = caseData.caseName + ' 편집';
      document.getElementById('slugLabel').textContent = 'slug: ' + slug;
      document.getElementById('fieldCaseName').value = caseData.caseName || '';
      document.getElementById('fieldSummary').value = caseData.summary || '';
      document.getElementById('memoField').value = '';
      renderTabs();
      renderLandingEditor();
      renderMemoHistory();
      renderComments();
    })
    .catch(err => {
      document.getElementById('landingEditor').textContent = '오류: ' + err.message;
    });

  function renderTabs() {
    document.getElementById('groupTabs').innerHTML = GROUPS.map(g =>
      `<button class="tab${g.key === activeGroup ? ' active' : ''}" onclick="switchGroup('${g.key}')">${g.label}</button>`
    ).join('');
  }

  function switchGroup(key) {
    activeGroup = key;
    renderTabs();
    renderLandingEditor();
  }

  function defaultGroupForCase(item) {
    const targetGroups = Array.isArray(item?.targetGroups) ? item.targetGroups : [];
    if (item?.createdBy === 'voicephishing-manual' || targetGroups.includes('la')) return 'la';
    if (item?.createdBy === 'tujasagi-manual' || targetGroups.includes('lc')) return 'lc';
    if (item?.createdBy === 'readingroom-manual' || targetGroups.includes('ld')) return 'ld';
    if (item?.createdBy === 'chaemubu-manual' || targetGroups.includes('le')) return 'le';
    if (item?.createdBy === 'recovery-manual' || item?.createdBy === 'jipjeong-manual' || targetGroups.includes('c')) return 'c';
    return 'a';
  }

  function renderLandingEditor() {
    const landing = caseData?.landings?.[activeGroup] || {};
    document.getElementById('landingEditor').innerHTML = FIELDS.map(f => {
      const val = f.key === 'currentProgress'
        ? firstFilled(
          landing.currentProgress,
          caseData?.currentProgressByKey?.[activeGroup],
          activeGroup === 'a' ? caseData?.currentProgress : null,
          extractCurrentProgress(landing.body)
        )
        : landing[f.key];
      const text = f.multi ? (Array.isArray(val) ? val.join('\n') : (val || '')) : (val || '');
      return `<div class="field">
        <label>${esc(f.label)}</label>
        <textarea id="field_${f.key}" rows="${f.multi ? 5 : 2}">${esc(text)}</textarea>
        ${f.multi ? `<p class="hint">${f.key === 'currentProgress' ? '이 내용은 공개 페이지에서 “현재 진행 상황” 단락으로 따로 표시됩니다.' : '줄바꿈(Enter)으로 항목을 구분합니다. 본문에서 ## 로 시작하는 줄은 H2 제목으로 표시됩니다.'}</p>` : ''}
      </div>`;
    }).join('');
    document.getElementById('landingEditor').className = '';
  }

  function extractCurrentProgress(body) {
    const items = Array.isArray(body)
      ? body.map(s => String(s || '').trim()).filter(Boolean)
      : String(body || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
    const start = items.findIndex(item => item.replace(/^#{1,4}\s*/, '').trim() === '현재 진행 상황');
    if (start === -1) return [];
    const out = [];
    for (let i = start + 1; i < items.length; i += 1) {
      if (/^#{1,4}\s+/.test(items[i])) break;
      out.push(items[i]);
    }
    return out;
  }

  function firstFilled(...values) {
    for (const value of values) {
      if (Array.isArray(value) && value.some(item => String(item || '').trim())) return value;
      if (!Array.isArray(value) && String(value || '').trim()) return value;
    }
    return [];
  }

  async function saveBasicInfo() {
    const msg = document.getElementById('basicMsg');
    msg.textContent = '저장 중...'; msg.className = 'msg';
    const newName = document.getElementById('fieldCaseName').value.trim();
    const newSummary = document.getElementById('fieldSummary').value.trim();
    if (!newName) { msg.textContent = '사건명을 입력하세요.'; msg.className = 'msg err'; return; }
    const r1 = await api('/api/update-case', { slug, action: 'rename', value: newName });
    if (!r1.ok) { msg.textContent = '저장 실패: ' + (r1.message || ''); msg.className = 'msg err'; return; }
    if (r1.updatedCase) caseData = r1.updatedCase;
    if (newSummary) {
      const r2 = await api('/api/update-case', { slug, action: 'update-summary', value: newSummary });
      if (!r2.ok) { msg.textContent = '요약 저장 실패: ' + (r2.message || ''); msg.className = 'msg err'; return; }
      if (r2.updatedCase) caseData = r2.updatedCase;
    }
    document.getElementById('pageTitle').textContent = caseData.caseName + ' 편집';
    msg.textContent = '저장 완료'; msg.className = 'msg ok';
    setTimeout(() => msg.textContent = '', 3000);
  }

  async function saveLanding() {
    const msg = document.getElementById('landingMsg');
    msg.textContent = '저장 중...'; msg.className = 'msg';
    const fields = {};
    for (const f of FIELDS) {
      const el = document.getElementById('field_' + f.key);
      if (!el) continue;
      const rawVal = el.value;
      if (!rawVal.trim()) continue; // 비어 있는 필드는 건너뜀
      fields[f.key] = f.multi
        ? rawVal.split('\n').map(s => s.trim()).filter(Boolean)
        : rawVal.trim();
    }
    if (!Object.keys(fields).length) {
      msg.textContent = '저장할 내용이 없습니다.'; msg.className = 'msg err';
      return;
    }
    const res = await api('/api/update-case', { slug, action: 'update-landing-fields', groupKey: activeGroup, value: fields });
    if (!res.ok) { msg.textContent = '저장 실패: ' + (res.message || ''); msg.className = 'msg err'; return; }
    if (res.updatedCase) caseData = res.updatedCase;
    msg.textContent = '저장 완료'; msg.className = 'msg ok';
    setTimeout(() => msg.textContent = '', 3000);
  }

  async function saveMemo() {
    const msg = document.getElementById('memoMsg');
    const text = document.getElementById('memoField').value.trim();
    if (!text) { msg.textContent = '메모 내용을 입력하세요.'; msg.className = 'msg err'; return; }
    msg.textContent = '저장 중...'; msg.className = 'msg';
    const res = await api('/api/update-case', { slug, action: 'add-memo', value: text });
    if (res.ok) {
      caseData = res.updatedCase;
      renderMemoHistory();
      document.getElementById('memoField').value = '';
      msg.textContent = '메모 추가 완료';
      msg.className = 'msg ok';
      setTimeout(() => msg.textContent = '', 3000);
    }
    else { msg.textContent = '저장 실패: ' + (res.message || ''); msg.className = 'msg err'; }
  }

  function renderMemoHistory() {
    const list = [];
    const seen = new Set();
    function addMemo(item) {
      const text = typeof item === 'string' ? item : item?.text;
      const clean = String(text || '').trim();
      const createdAt = typeof item === 'object' ? (item.createdAt || '') : '';
      const editedAt = typeof item === 'object' ? (item.editedAt || '') : '';
      const id = typeof item === 'object' ? (item.id ?? '') : '';
      const key = id !== '' ? String(id) : (createdAt ? `${createdAt}\n${clean}` : clean);
      if (!clean || seen.has(key)) return;
      seen.add(key);
      list.push({ text: clean, createdAt, editedAt, id });
    }
    if (caseData?.memo) addMemo({ text: caseData.memo });
    if (Array.isArray(caseData?.memos)) caseData.memos.forEach(addMemo);
    const el = document.getElementById('memoList');
    el.className = 'memo-list';
    if (!list.length) {
      el.innerHTML = '<p style="color:#8a96a8;font-size:14px;margin:0">등록된 운영자 메모가 없습니다.</p>';
      return;
    }
    el.innerHTML = list.map((item, idx) => {
      const safeText = esc(item.text);
      const safeId = esc(String(item.id ?? ''));
      const dateStr = item.editedAt ? `${esc(item.createdAt || '')} (수정: ${esc(item.editedAt)})` : esc(item.createdAt || '');
      return `<div class="memo-item" data-memo-idx="${idx}" data-memo-id="${safeId}" data-memo-text="${safeText}">
        <div class="memo-actions">
          <button class="memo-btn edit" onclick="startEditMemo(${idx})">수정</button>
          <button class="memo-btn del" onclick="deleteMemo(${idx})">삭제</button>
        </div>
        <div class="memo-text" id="memo-text-${idx}">${safeText}</div>
        ${dateStr ? `<div class="memo-date">${dateStr}</div>` : ''}
        <div class="memo-edit-area" id="memo-edit-${idx}">
          <textarea id="memo-edit-ta-${idx}" rows="3">${safeText}</textarea>
          <div class="memo-edit-row">
            <button class="memo-save-btn" onclick="saveEditMemo(${idx})">저장</button>
            <button class="memo-cancel-btn" onclick="cancelEditMemo(${idx})">취소</button>
          </div>
        </div>
      </div>`;
    }).join('');
    // store list reference for actions
    window._memoList = list;
  }

  async function deleteMemo(idx) {
    const item = window._memoList?.[idx];
    if (!item) return;
    if (!confirm(`이 메모를 삭제하시겠습니까?\n\n"${item.text.slice(0, 80)}${item.text.length > 80 ? '…' : ''}"`)) return;
    const payload = { slug, action: 'delete-memo', memoText: item.text };
    if (item.id !== '') payload.memoId = item.id;
    const res = await api('/api/update-case', payload);
    if (res.ok) { caseData = res.updatedCase; renderMemoHistory(); }
    else alert('삭제 실패: ' + (res.message || ''));
  }

  function startEditMemo(idx) {
    document.getElementById(`memo-edit-${idx}`).style.display = 'block';
    document.getElementById(`memo-text-${idx}`).style.display = 'none';
    document.querySelector(`[data-memo-idx="${idx}"] .memo-actions`).style.display = 'none';
    document.getElementById(`memo-edit-ta-${idx}`).focus();
  }

  function cancelEditMemo(idx) {
    document.getElementById(`memo-edit-${idx}`).style.display = 'none';
    document.getElementById(`memo-text-${idx}`).style.display = '';
    document.querySelector(`[data-memo-idx="${idx}"] .memo-actions`).style.display = '';
  }

  async function saveEditMemo(idx) {
    const item = window._memoList?.[idx];
    if (!item) return;
    const newText = document.getElementById(`memo-edit-ta-${idx}`).value.trim();
    if (!newText) { alert('메모 내용을 입력하세요.'); return; }
    if (newText === item.text) { cancelEditMemo(idx); return; }
    const payload = { slug, action: 'edit-memo', memoText: item.text, newText };
    if (item.id !== '') payload.memoId = item.id;
    const res = await api('/api/update-case', payload);
    if (res.ok) { caseData = res.updatedCase; renderMemoHistory(); }
    else alert('수정 실패: ' + (res.message || ''));
  }

  function renderComments() {
    const comments = caseData?.comments || [];
    const el = document.getElementById('commentList');
    el.className = 'comment-list';
    if (!comments.length) { el.innerHTML = '<p style="color:#8a96a8;font-size:14px">등록된 댓글이 없습니다.</p>'; return; }
    el.innerHTML = comments.map(c => `
      <div class="comment-item">
        <div>
          <div class="comment-text">${esc(c.text)}</div>
          <div class="comment-date">${esc(c.createdAt)}</div>
        </div>
        <button class="btn danger sm" onclick="deleteComment(${c.id})">삭제</button>
      </div>`).join('');
  }

  async function addComment() {
    const msg = document.getElementById('commentMsg');
    const text = document.getElementById('newComment').value.trim();
    if (!text) { msg.textContent = '댓글을 입력하세요.'; msg.className = 'msg err'; return; }
    msg.textContent = '추가 중...'; msg.className = 'msg';
    const res = await api('/api/update-case', { slug, action: 'add-comment', comment: text });
    if (res.ok) {
      caseData = res.updatedCase;
      renderComments();
      document.getElementById('newComment').value = '';
      msg.textContent = '댓글 추가 완료'; msg.className = 'msg ok';
      setTimeout(() => msg.textContent = '', 3000);
    } else { msg.textContent = '추가 실패: ' + (res.message || ''); msg.className = 'msg err'; }
  }

  async function deleteComment(id) {
    if (!confirm('댓글을 삭제할까요?')) return;
    const msg = document.getElementById('commentMsg');
    const res = await api('/api/update-case', { slug, action: 'delete-comment', commentId: id });
    if (res.ok) {
      caseData = res.updatedCase;
      renderComments();
      msg.textContent = '삭제 완료'; msg.className = 'msg ok';
      setTimeout(() => msg.textContent = '', 3000);
    } else { msg.textContent = '삭제 실패'; msg.className = 'msg err'; }
  }

  async function api(url, body) {
    try {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return await res.json();
    } catch (e) { return { ok: false, message: e.message }; }
  }

  async function syncFromGithub() {
    if (!confirm('GitHub cases.json의 최신 데이터를 KV에 즉시 반영합니다.\n계속하시겠습니까?')) return;
    const msg = document.getElementById('basicMsg');
    msg.textContent = '동기화 중...'; msg.className = 'msg';
    const res = await api('/api/update-case', { slug, action: 'sync-from-github' });
    if (res.ok) {
      if (res.updatedCase) {
        caseData = res.updatedCase;
        document.getElementById('fieldCaseName').value = caseData.caseName || '';
        document.getElementById('fieldSummary').value = caseData.summary || '';
        document.getElementById('pageTitle').textContent = caseData.caseName + ' 편집';
      }
      msg.textContent = 'KV 반영 완료'; msg.className = 'msg ok';
      setTimeout(() => msg.textContent = '', 3000);
    } else {
      msg.textContent = '실패: ' + (res.message || ''); msg.className = 'msg err';
    }
  }

  function esc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>
</body>
</html>
