<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지급정지 랜딩 대량 생성</title>
  <link rel="stylesheet" href="/admin/category-bulk.css?v=20260820-1">
</head>
<body>
  <main class="bulk-wrap">
    <header class="bulk-top">
      <div>
        <h1>지급정지 랜딩 생성</h1>
        <p class="bulk-meta">gnlaw-recovery.co.kr 전용 · 지급정지 페이지를 한 번에 최대 30개 생성합니다.</p>
      </div>
      <div class="bulk-top-actions">
        <button id="batchUpdateBtn" class="btn light" type="button" onclick="batchUpdate()">기존 페이지 일괄 업데이트</button>
        <a class="btn sec" href="/admin/dashboard.html">관리자 대시보드</a>
      </div>
    </header>

    <section class="bulk-card">
      <div class="bulk-table-scroll">
        <table>
          <thead><tr><th style="width:48px">No.</th><th>페이지 제목</th><th style="width:250px">URL slug (선택)</th><th style="width:70px">생성</th><th style="width:220px">결과</th></tr></thead>
          <tbody id="bulkRows"></tbody>
        </table>
      </div>
      <p class="bulk-help">제목만 입력하면 원고·메타 정보와 URL이 기존 지급정지 전용 템플릿으로 자동 생성됩니다. URL slug는 비워두면 제목을 기준으로 자동 생성됩니다.</p>
      <div class="bulk-actions">
        <button id="bulkCreateButton" class="btn" type="button" disabled>선택한 지급정지 랜딩 대량 생성</button>
        <button id="bulkSelectAllButton" class="btn light" type="button">전체 선택</button>
        <button id="bulkClearAllButton" class="btn light" type="button">전체 해제</button>
        <button id="bulkRefreshButton" class="btn sec" type="button">🔄 새로고침 (새 30개)</button>
        <span id="bulkMessage" class="bulk-message"></span>
      </div>
      <div id="bulkProgress" class="progress"><div class="progress-track"><div id="bulkProgressBar" class="progress-bar"></div></div><span id="bulkProgressText" class="progress-text"></span></div>
    </section>
  </main>
  <script>
    window.CATEGORY_BULK_CONFIG = {
      endpoint: "/api/create-jipjeong-landing",
      placeholder: "예: 신한은행 지급정지 이의신청 - 종로변호사",
      mode: "title"
    };
  </script>
  <script src="/admin/category-bulk.js?v=20260820-1"></script>
  <script>
    async function batchUpdate(){
      if (!confirm("기존 지급정지 페이지들을 모두 최신 템플릿으로 업데이트하시겠습니까?")) return;
      const button = document.getElementById("batchUpdateBtn");
      button.disabled = true;
      button.textContent = "업데이트 중...";
      try {
        const response = await fetch("/api/batch-update-jipjeong", { method: "POST" });
        const data = await response.json();
        if (!data.ok) throw new Error(data.message || "업데이트 실패");
        alert(`완료!\n총 ${data.total}건 중 ${data.updated}건 업데이트${data.errors ? ` / 오류 ${data.errors}건` : ""}`);
      } catch (error) {
        alert("오류: " + error.message);
      } finally {
        button.disabled = false;
        button.textContent = "기존 페이지 일괄 업데이트";
      }
    }
  </script>
</body>
</html>
