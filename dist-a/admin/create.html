<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사건 생성</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
      max-width: 1120px;
      margin: 0 auto;
      color: #172033;
      background: #f6f8fb;
    }

    form,
    .panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      background: #fff;
      border: 1px solid #dde3ee;
      border-radius: 8px;
    }

    input,
    textarea,
    button {
      padding: 12px;
      font-size: 16px;
    }

    input[readonly] {
      background: #f4f6fb;
      color: #6b7a90;
    }

    textarea {
      min-height: 90px;
      font-family: Consolas, monospace;
      resize: vertical;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #1f4fd8;
      color: #fff;
      font-weight: 700;
    }

    button.secondary {
      background: #263244;
    }

    button.danger {
      background: #8a1f1f;
      padding: 6px 10px;
      font-size: 13px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .panel {
      margin-top: 20px;
      display: none;
    }

    .panel.is-visible {
      display: flex;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      background: #edf7ed;
      color: #145b22;
      white-space: pre-wrap;
    }

    .status.warning {
      background: #fff7e0;
      color: #714900;
    }

    .status.blocked {
      background: #ffe8e8;
      color: #8a1f1f;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #dde3ee;
      padding-bottom: 12px;
    }

    .tab-button {
      background: #edf1f7;
      color: #263244;
      padding: 10px 14px;
      border: 1px solid #d7deea;
    }

    .tab-button.is-active {
      background: #1f4fd8;
      color: #fff;
      border-color: #1f4fd8;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .edit-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .edit-field.wide {
      grid-column: 1 / -1;
    }

    .edit-field label {
      font-size: 13px;
      font-weight: 600;
      color: #4b5a70;
    }

    .edit-field input,
    .edit-field textarea {
      border: 1px solid #d0d7e3;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .edit-field textarea.lines {
      min-height: 110px;
    }

    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .faq-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: start;
      padding: 12px;
      border: 1px solid #e1e6ef;
      border-radius: 6px;
      background: #fafbfd;
    }

    .faq-item-fields {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .faq-item input,
    .faq-item textarea {
      border: 1px solid #d0d7e3;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
      font-size: 14px;
      padding: 8px 10px;
    }

    .faq-item textarea {
      min-height: 60px;
      font-family: sans-serif;
    }

    .add-faq-btn {
      margin-top: 6px;
      background: #3d5a80;
      padding: 8px 14px;
      font-size: 14px;
      align-self: flex-start;
    }

    @media (max-width: 760px) {
      body {
        padding: 20px;
      }

      .actions,
      .edit-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div style="margin-bottom:16px">
    <a href="/admin/dashboard.html" style="display:inline-flex;align-items:center;height:36px;padding:0 14px;background:#263244;color:#fff;border-radius:7px;font-size:13px;font-weight:700;text-decoration:none">← 관리자 대시보드</a>
  </div>

  <h1>사건 생성</h1>

  <form id="createForm">
    <input id="caseName" type="text" placeholder="사건명" required />

    <div class="actions">
      <button id="generateDraftButton" class="secondary" type="button">
        AI 원고 생성
      </button>

      <button id="submitButton" type="submit" disabled>
        사건 생성
      </button>
    </div>

    <input id="slug" type="text" placeholder="slug" readonly required />
    <input id="category" type="hidden" />
    <textarea id="summary" placeholder="요약" readonly required></textarea>
  </form>

  <div id="successBox" style="display:none;margin-top:16px;padding:18px 20px;background:#edf7ed;border:1px solid #b2dfb2;border-radius:8px;color:#145b22">
    <strong id="successTitle">✅ 저장 완료</strong>
    <div id="successLinks" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px"></div>
    <p style="margin:12px 0 0;font-size:12px;color:#3d7a4a">랜딩페이지 반영까지 최대 30초 소요될 수 있습니다. 링크가 열리지 않으면 잠시 후 다시 시도하세요.</p>
    <button type="button" onclick="resetForNewCase()" style="margin-top:14px;padding:10px 18px;background:#1f4fd8;color:#fff;border:0;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer">+ 새 사건 생성</button>
  </div>

  <section id="reviewPanel" class="panel" aria-live="polite">
    <strong>AI 데이터 검수 결과</strong>
    <div id="reviewStatus" class="status"></div>

    <div id="previewTabs" class="tabs" role="tablist" aria-label="도메인별 원고 편집"></div>
    <div id="landingEditor" class="edit-grid"></div>
  </section>

  <p id="message"></p>

  <script>
    const GROUPS = [
      { key: "a", label: "A 형사고소형" },
      { key: "b", label: "B 민사소송형" },
      { key: "c", label: "C 성공사례형" },
      { key: "d", label: "D 정보형" },
      { key: "e", label: "E 전체허브형" },
      { key: "la", label: "lA 금융피해형" },
      { key: "lb", label: "lB 회수전략형" },
      { key: "lc", label: "lC 사례아카이브형" },
      { key: "ld", label: "lD AI브리핑형" },
      { key: "le", label: "lE 사건허브형" },
    ];

    const LANDING_GROUPS = [
      { label: "A 형사고소",   url: "https://gnlaw-criminal.co.kr", prefix: "prosecute" },
      { label: "B 민사소송",   url: "https://gnlaw-civil.co.kr",   prefix: "civil" },
      { label: "C 성공사례",   url: "https://gnlaw-recovery.co.kr",   prefix: "success" },
      { label: "D 사건정보",   url: "https://gnlaw-case.co.kr",   prefix: "briefing" },
      { label: "E 전체허브",   url: "https://gnlaw-center.co.kr",   prefix: "case" },
      { label: "lA 금융피해",  url: "https://금융사기대응센터.kr",           prefix: "prosecute" },
      { label: "lB 회수전략",  url: "https://금융피해대응센터.kr",           prefix: "civil" },
      { label: "lC 사례아카이브", url: "https://사기피해구제센터.kr",        prefix: "success" },
      { label: "lD AI브리핑",  url: "https://리딩방피해회수센터.kr",           prefix: "briefing" },
      { label: "lE 사건허브",  url: "https://투자사기대응센터.kr",           prefix: "case" },
    ];

    const OG_IMAGE_VERSION = "20260630b1";
    [
      ["https://xn--jj0b0cw1o75qwua31zyfp19e.kr", "criminal"],
      ["https://xn--jj0b77gmsoyyfbet54ddvg2ma.kr", "litigation"],
      ["https://xn--2e0bno217bsqa58yp8nd1g2ma.kr", "results"],
      ["https://xn--o01bo9fw8bq3ho5ap91depg2maj5f.kr", "insights"],
      ["https://xn--ok0b84g7tosqai7vyka788co0b.kr", "incidents"],
    ].forEach(function(row, index) {
      LANDING_GROUPS[index + 5].url = row[0];
      LANDING_GROUPS[index + 5].prefix = row[1];
    });

    const caseNameEl = document.getElementById("caseName");
    const slugEl = document.getElementById("slug");
    const categoryEl = document.getElementById("category");
    const summaryEl = document.getElementById("summary");
    const messageEl = document.getElementById("message");
    const reviewPanelEl = document.getElementById("reviewPanel");
    const reviewStatusEl = document.getElementById("reviewStatus");
    const previewTabsEl = document.getElementById("previewTabs");
    const landingEditorEl = document.getElementById("landingEditor");
    const generateDraftButtonEl = document.getElementById("generateDraftButton");
    const submitButtonEl = document.getElementById("submitButton");
    const successBoxEl = document.getElementById("successBox");
    const successTitleEl = document.getElementById("successTitle");
    const successLinksEl = document.getElementById("successLinks");
    const API_ORIGIN = location.protocol === "file:" ? "https://gnlaw-criminal.co.kr" : "";

    let generatedCase = null;
    let editedLandings = {};
    let activePreviewKey = "a";
    let isSaving = false;
    const savedSlugs = new Set(); // 이번 세션에서 저장된 slug 추적

    function val(id) {
      return (document.getElementById(id)?.value || "").trim();
    }

    async function fetchJson(path, options = {}) {
      const res = await fetch(`${API_ORIGIN}${path}`, {
        ...options,
        credentials: API_ORIGIN ? "include" : "same-origin",
        headers: {
          Accept: "application/json",
          ...(options.headers || {}),
        },
      });
      const text = await res.text();
      const contentType = res.headers.get("content-type") || "";

      if (!contentType.includes("application/json")) {
        const preview = text
          .replace(/<script[\s\S]*?<\/script>/gi, "")
          .replace(/<style[\s\S]*?<\/style>/gi, "")
          .replace(/<[^>]+>/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 220);
        throw new Error(`서버가 JSON이 아닌 응답을 반환했습니다. (${res.status} ${res.statusText}) ${preview || text.slice(0, 120)}`);
      }

      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch (error) {
        throw new Error(`JSON 파싱 오류: ${error.message}. 응답 일부: ${text.slice(0, 180)}`);
      }

      return { res, data };
    }

    function lines(id) {
      return (document.getElementById(id)?.value || "")
        .split("\n")
        .map((s) => s.trim())
        .filter(Boolean);
    }

    function collectFaq() {
      return Array.from(document.querySelectorAll(".faq-item")).map((item) => ({
        question: (item.querySelector(".faq-q")?.value || "").trim(),
        answer: (item.querySelector(".faq-a")?.value || "").trim(),
      })).filter((f) => f.question || f.answer);
    }

    function saveCurrentTabEdits() {
      if (!generatedCase || !activePreviewKey) return;
      const k = activePreviewKey;
      const base = generatedCase.landings[k] || {};
      editedLandings[k] = {
        ...base,
        title: val("pv-title"),
        description: val("pv-description"),
        ogTitle: val("pv-ogTitle"),
        ogDescription: val("pv-ogDescription"),
        h1: val("pv-h1"),
        body: lines("pv-body"),
        victimCases: lines("pv-victimCases"),
        faq: collectFaq(),
      };
    }

    function buildSubmitCase() {
      saveCurrentTabEdits();
      const result = JSON.parse(JSON.stringify(generatedCase));
      for (const g of GROUPS) {
        if (editedLandings[g.key]) result.landings[g.key] = editedLandings[g.key];
      }
      return result;
    }

    function resetGeneratedData() {
      generatedCase = null;
      editedLandings = {};
      submitButtonEl.disabled = true;
      reviewPanelEl.classList.remove("is-visible");
      reviewStatusEl.textContent = "";
      previewTabsEl.innerHTML = "";
      landingEditorEl.innerHTML = "";
      slugEl.value = "";
      categoryEl.value = "";
      summaryEl.value = "";
    }

    function resetForNewCase() {
      caseNameEl.value = "";
      resetGeneratedData();
      messageEl.textContent = "";
      successBoxEl.style.display = "none";
      successLinksEl.innerHTML = "";
      isSaving = false;
    }

    function showSaveSuccess(slug, caseName) {
      successTitleEl.textContent = `✅ "${caseName}" 저장 완료!`;
      successLinksEl.innerHTML = "";
      for (const g of LANDING_GROUPS) {
        const a = document.createElement("a");
        a.href = `${g.url}/${g.prefix}/${encodeURIComponent(slug)}/`;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = g.label;
        a.style.cssText = "display:inline-block;padding:6px 12px;background:#1f4fd8;color:#fff;border-radius:6px;font-size:13px;font-weight:700;text-decoration:none";
        successLinksEl.appendChild(a);
      }
      successBoxEl.style.display = "block";
      messageEl.textContent = "";

      // OG 이미지 warm-up: 10개 도메인 각각 /og/slug.png 1회 호출 → CDN 엣지 캐시 선점
      // 랜딩페이지 prefetch: 각 도메인 랜딩 URL 1회 호출 → Worker SSR + CDN 캐시
      const encoded = encodeURIComponent(slug);
      for (const g of LANDING_GROUPS) {
        fetch(`${g.url}/og/${encoded}.png?v=${OG_IMAGE_VERSION}`, { method: "GET", mode: "no-cors", cache: "no-store" }).catch(function(){});
        fetch(`${g.url}/${g.prefix}/${encoded}/`, { method: "GET", mode: "no-cors", cache: "no-store" }).catch(function(){});
      }
    }

    function renderGeneratedData(data) {
      generatedCase = data.case;
      editedLandings = {};
      slugEl.value = generatedCase.slug;
      categoryEl.value = generatedCase.category;
      summaryEl.value = generatedCase.summary;

      const status = data.review.status;
      reviewPanelEl.classList.add("is-visible");
      reviewStatusEl.className = `status ${status}`;
      const sourceLabel = "✅ 원고 생성 완료";
      reviewStatusEl.textContent = [
        sourceLabel,
        status === "blocked"
          ? "저장 차단: 동일 또는 매우 유사한 사건이 있습니다."
          : status === "warning"
            ? "주의: 유사 사건이 있습니다. 기존 사건과 별도인지 확인하세요."
            : "통과: 중복 위험이 낮습니다.",
        ...(data.review.notes || []),
        ...(data.review.duplicateCheck.matches || []).map((item) => `유사 후보: ${item.caseName || item.slug} / ${item.slug} / ${Math.round(item.score * 100)}%`),
      ].join("\n");

      activePreviewKey = "a";
      renderPreviewTabs();
      renderLandingEditor(activePreviewKey);

      submitButtonEl.disabled = status === "blocked";
    }

    function renderPreviewTabs() {
      previewTabsEl.innerHTML = "";
      for (const group of GROUPS) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `tab-button${group.key === activePreviewKey ? " is-active" : ""}`;
        button.textContent = group.label;
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", String(group.key === activePreviewKey));
        button.addEventListener("click", () => {
          saveCurrentTabEdits();
          activePreviewKey = group.key;
          renderPreviewTabs();
          renderLandingEditor(group.key);
        });
        previewTabsEl.appendChild(button);
      }
    }

    function renderLandingEditor(key) {
      const src = editedLandings[key] || generatedCase?.landings?.[key];
      landingEditorEl.innerHTML = "";

      if (!src) return;

      landingEditorEl.append(
        makeInput("title", "타이틀 (title)", src.title),
        makeInput("ogTitle", "OG 제목 (ogTitle)", src.ogTitle),
        makeTextarea("description", "메타 설명 (description)", src.description),
        makeTextarea("ogDescription", "OG 설명 (ogDescription)", src.ogDescription),
        makeInput("h1", "H1 제목", src.h1),
        makeReadonly("canonical", "Canonical URL", src.canonical),
        makeReadonly("ogImage", "OG Image URL", src.ogImage),
        makeLines("body", "본문 원고 (한 줄 = 한 단락)", src.body),
        makeLines("victimCases", "피해 사례 (한 줄 = 한 항목)", src.victimCases),
        makeFaqEditor("faq", "FAQ", src.faq),
      );
    }

    function makeInput(id, label, value = "") {
      const wrap = document.createElement("div");
      wrap.className = "edit-field";
      const lbl = document.createElement("label");
      lbl.htmlFor = `pv-${id}`;
      lbl.textContent = label;
      const inp = document.createElement("input");
      inp.type = "text";
      inp.id = `pv-${id}`;
      inp.value = value;
      wrap.append(lbl, inp);
      return wrap;
    }

    function makeReadonly(id, label, value = "") {
      const wrap = makeInput(id, label, value);
      wrap.querySelector("input").readOnly = true;
      return wrap;
    }

    function makeTextarea(id, label, value = "") {
      const wrap = document.createElement("div");
      wrap.className = "edit-field wide";
      const lbl = document.createElement("label");
      lbl.htmlFor = `pv-${id}`;
      lbl.textContent = label;
      const ta = document.createElement("textarea");
      ta.id = `pv-${id}`;
      ta.value = value;
      wrap.append(lbl, ta);
      return wrap;
    }

    function makeLines(id, label, values = []) {
      const wrap = document.createElement("div");
      wrap.className = "edit-field wide";
      const lbl = document.createElement("label");
      lbl.htmlFor = `pv-${id}`;
      lbl.textContent = label;
      const ta = document.createElement("textarea");
      ta.className = "lines";
      ta.id = `pv-${id}`;
      ta.value = (values || []).join("\n");
      wrap.append(lbl, ta);
      return wrap;
    }

    function makeFaqEditor(id, label, faqItems = []) {
      const wrap = document.createElement("div");
      wrap.className = "edit-field wide";
      const lbl = document.createElement("label");
      lbl.textContent = label;

      const list = document.createElement("div");
      list.className = "faq-list";
      list.id = `pv-${id}-list`;

      for (const item of (faqItems || [])) {
        list.appendChild(createFaqItem(item.question, item.answer));
      }

      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "add-faq-btn";
      addBtn.textContent = "+ FAQ 추가";
      addBtn.addEventListener("click", () => {
        list.appendChild(createFaqItem("", ""));
      });

      wrap.append(lbl, list, addBtn);
      return wrap;
    }

    function createFaqItem(question = "", answer = "") {
      const item = document.createElement("div");
      item.className = "faq-item";

      const fields = document.createElement("div");
      fields.className = "faq-item-fields";

      const qInput = document.createElement("input");
      qInput.type = "text";
      qInput.className = "faq-q";
      qInput.placeholder = "질문";
      qInput.value = question;

      const aArea = document.createElement("textarea");
      aArea.className = "faq-a";
      aArea.placeholder = "답변";
      aArea.value = answer;

      fields.append(qInput, aArea);

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "danger";
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", () => item.remove());

      item.append(fields, delBtn);
      return item;
    }

    caseNameEl.addEventListener("input", resetGeneratedData);

    generateDraftButtonEl.addEventListener("click", async () => {
      const caseName = caseNameEl.value.trim().replace(/\s+/g, " ");

      if (!caseName) {
        messageEl.textContent = "사건명을 먼저 입력해주세요.";
        return;
      }

      messageEl.textContent = "AI 데이터 생성 및 중복 검수 중...";
      generateDraftButtonEl.disabled = true;

      try {
        const { data } = await fetchJson("/api/generate-draft", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ caseName }),
        });

        if (!data.ok) {
          messageEl.textContent = data.message || "AI 데이터 생성에 실패했습니다.";
          return;
        }

        renderGeneratedData(data);
        messageEl.textContent = "AI 데이터 생성 완료. 도메인별 원고를 수정한 뒤 사건 생성을 진행하세요.";
      } catch (error) {
        messageEl.textContent = `AI 데이터 생성 오류: ${error.message}`;
      } finally {
        generateDraftButtonEl.disabled = false;
      }
    });

    document.getElementById("createForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!generatedCase) {
        messageEl.textContent = "먼저 AI 원고 생성을 실행해주세요.";
        return;
      }

      if (isSaving) return; // 중복 클릭 방지

      const caseToSave = buildSubmitCase();

      // 이번 세션에서 이미 저장된 slug면 링크만 표시
      if (savedSlugs.has(caseToSave.slug)) {
        showSaveSuccess(caseToSave.slug, caseToSave.caseName);
        return;
      }

      isSaving = true;
      messageEl.textContent = "사건 저장 중...";
      submitButtonEl.disabled = true;

      try {
        const { res, data } = await fetchJson("/api/create-case", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(caseToSave),
        });

        if (data.ok) {
          savedSlugs.add(caseToSave.slug);
          showSaveSuccess(caseToSave.slug, caseToSave.caseName);
        } else if (res.status === 409) {
          // 이미 서버에 존재 → 링크만 표시
          savedSlugs.add(caseToSave.slug);
          showSaveSuccess(caseToSave.slug, caseToSave.caseName);
          successTitleEl.textContent += " (이미 등록된 사건)";
        } else {
          messageEl.textContent = data.message || JSON.stringify(data, null, 2);
          submitButtonEl.disabled = false;
          isSaving = false;
        }
      } catch (err) {
        messageEl.textContent = "저장 오류: " + err.message;
        submitButtonEl.disabled = false;
        isSaving = false;
      }
    });
  </script>

</body>
</html>
