<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fb;color:#172033}
    .wrap{max-width:1200px;margin:0 auto;padding:32px 20px 60px}
    h1{margin:0 0 6px;font-size:24px}
    h2{margin:0;font-size:17px;color:#263244}
    .top-nav{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;height:38px;padding:0 16px;border:0;border-radius:7px;background:#1f4fd8;color:#fff;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
    .btn.sec{background:#263244}
    .btn.sm{height:28px;padding:0 10px;font-size:12px}
    .btn.danger{background:#c0392b}
    .type-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:800}
    .tc{background:#e8f0fe;color:#1f4fd8}
    .tp{background:#fef3e8;color:#b35d0b}
    .type-cell{display:flex;flex-direction:column;gap:6px;min-width:168px}
    .type-select{width:100%;height:31px;border:1px solid #cfd8e6;border-radius:6px;background:#fff;color:#263244;font-size:12px;font-weight:700}
    /* section */
    .section{margin-bottom:32px}
    .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
    .sec-head .meta{font-size:13px;color:#8a96a8;font-weight:400;margin-left:8px}
    .search-row{display:flex;gap:8px;margin-bottom:10px}
    .search-row input{flex:1;border:1px solid #cfd8e6;border-radius:7px;padding:9px 13px;font:inherit;font-size:14px}
    /* unified table */
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
    th,td{padding:11px 14px;text-align:left;font-size:13px;border-bottom:1px solid #e8edf4}
    th{background:#f0f4fa;font-weight:800;color:#4b5a70}
    tr:last-child td{border-bottom:0}
    tr:hover td{background:#f8faff}
    tr.hidden{display:none}
    .act a{margin-right:6px;color:#1f4fd8;font-weight:700;text-decoration:none;font-size:12px}
    .act a.del{color:#c0392b}
    .name-cell strong{display:block}
    .name-cell .slug{color:#8a96a8;font-size:11px}
    .loading{text-align:center;padding:36px;color:#8a96a8}
    .noindex-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:800;background:#fde8e8;color:#c0392b;margin-left:4px;vertical-align:middle}
    .pg-wrap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px 0}
    .pg-btn{min-width:36px;height:32px;padding:0 10px;border:1px solid #cfd8e6;border-radius:6px;background:#fff;color:#263244;font-size:13px;font-weight:700;cursor:pointer}
    .pg-btn:hover{background:#f0f4fa}
    .pg-active{background:#1f4fd8!important;color:#fff!important;border-color:#1f4fd8!important}
  </style>
</head>
<body>
<div class="wrap">
  <h1>관리자 대시보드</h1>
  <div class="top-nav">
    <a class="btn" href="/admin/create.html">+ 새 사건 생성</a>
    <a class="btn" href="/admin/powerlink.html">+ 파워링크 랜딩 생성</a>
    <a class="btn" href="/admin/recovery.html">리커버리 랜딩 생성</a>
    <a class="btn" href="/admin/jipjeong.html">지급정지 랜딩 생성</a>
    <a class="btn" href="/admin/voicephishing.html">보이스피싱 랜딩 생성</a>
    <a class="btn" href="/admin/chaemubu.html">채무부존재소송 랜딩 생성</a>
    <a class="btn" href="/admin/tujasagi.html">투자사기 랜딩 생성</a>
    <a class="btn" href="/admin/center-board.html">통합 허브 게시글 관리</a>
    <button class="btn sec" onclick="syncKvToGithub()">KV→GitHub 동기화</button>
    <button class="btn sec" onclick="batchApplyTemplates()">템플릿 일괄 적용</button>
    <a class="btn sec" href="/admin/settings.html">텔레그램 설정</a>
    <a class="btn sec" href="/admin/logout">로그아웃</a>
  </div>

  <!-- 통합 목록 (사건 + 파워링크) -->
  <div class="section">
    <div class="sec-head">
      <h2>전체 목록<span class="meta" id="totalCount"></span></h2>
    </div>
    <div class="search-row">
      <input id="mainSearch" type="text" placeholder="사건명, 제목, 슬러그 검색..." oninput="filterEntries()">
    </div>
    <table>
      <thead>
        <tr><th>No.</th><th>유형</th><th>제목/사건명</th><th>등록일</th><th>수정일</th><th>관리</th></tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="6" class="loading">로딩 중...</td></tr></tbody>
    </table>
    <div id="pagination" class="pg-wrap"></div>
  </div>
</div>

<script>
  const DOMAINS = [
    { label:'A',  url:'https://gnlaw-criminal.co.kr', prefix:'prosecute' },
    { label:'B',  url:'https://gnlaw-civil.co.kr',   prefix:'civil' },
    { label:'C',  url:'https://gnlaw-recovery.co.kr', prefix:'success' },
    { label:'D',  url:'https://gnlaw-case.co.kr',     prefix:'briefing' },
    { label:'E',  url:'https://gnlaw-center.co.kr',   prefix:'case' },
    { label:'lA', url:'https://금융사기대응센터.kr',         prefix:'prosecute' },
    { label:'lB', url:'https://금융피해대응센터.kr',         prefix:'civil' },
    { label:'lC', url:'https://사기피해구제센터.kr',         prefix:'success' },
    { label:'lD', url:'https://리딩방피해회수센터.kr',         prefix:'briefing' },
    { label:'lE', url:'https://투자사기대응센터.kr',         prefix:'case' },
  ];

  const PL_SITE = 'https://gnlaw-criminal.co.kr';
  const FRAUD_TYPE_OPTIONS = [
    { key:'stock-project', label:'주식 리딩방·투자 프로젝트' },
    { key:'institution-exchange', label:'증권사·은행·거래소 사칭' },
    { key:'team-mission', label:'팀미션·부업·영상 시청' },
    { key:'live-dating', label:'라이브 방송·만남 플랫폼' },
    { key:'refund-reward', label:'환불·보상금 지급 사칭' },
  ];
  let allEntries = [];
  let filteredEntries = [];
  let currentPage = 1;
  const PAGE_SIZE = 100;

  Promise.all([
    fetch('/api/get-cases').then(r => r.json()).catch(() => ({ ok: false })),
    fetch('/api/get-powerlinks').then(r => r.json()).catch(() => ({ ok: false })),
  ]).then(([cd, pd]) => {
    const cases = cd.ok ? cd.cases : [];
    const pls = pd.ok ? (pd.landings || []) : [];

    allEntries = [
      ...cases.map(c => ({
        type: 'case',
        name: c.caseName || '',
        slug: c.slug || '',
        createdAt: c.createdAt || '',
        updatedAt: c.updatedAt || '',
        memo: c.memo || false,
        noindex: c.noindex || false,
        createdBy: c.createdBy || '',
        fraudType: c.fraudType || c.scamType || '',
      })),
      ...pls.map(p => ({
        type: 'pl',
        name: p.title || '',
        slug: p.slug || '',
        createdAt: p.createdAt || '',
        updatedAt: p.updatedAt || '',
      })),
    ].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '') || (b.updatedAt || '').localeCompare(a.updatedAt || ''));

    filteredEntries = allEntries;
    renderEntries(filteredEntries);
  });

  /* ---- Pagination ---- */
  function goPage(p) {
    currentPage = p;
    renderEntries(filteredEntries);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPagination(total) {
    const pgEl = document.getElementById('pagination');
    if (!pgEl) return;
    if (total <= PAGE_SIZE) { pgEl.innerHTML = ''; return; }
    const pages = Math.ceil(total / PAGE_SIZE);
    let html = '';
    if (currentPage > 1) html += `<button class="pg-btn" onclick="goPage(${currentPage - 1})">이전</button>`;
    for (let p = 1; p <= pages; p++) {
      html += `<button class="pg-btn${p === currentPage ? ' pg-active' : ''}" onclick="goPage(${p})">${p}</button>`;
    }
    if (currentPage < pages) html += `<button class="pg-btn" onclick="goPage(${currentPage + 1})">다음</button>`;
    pgEl.innerHTML = html;
  }

  /* ---- Unified table ---- */
  function renderEntries(entries) {
    const total = allEntries.length;
    const filtered = entries.length;
    document.getElementById('totalCount').textContent = filtered < total
      ? `전체 ${total}건 (필터: ${filtered}건)`
      : `전체 ${total}건`;

    if (!entries.length) {
      document.getElementById('tbody').innerHTML = '<tr><td colspan="6" class="loading">검색 결과 없음</td></tr>';
      renderPagination(0);
      return;
    }

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageEntries = entries.slice(start, start + PAGE_SIZE);

    document.getElementById('tbody').innerHTML = pageEntries.map((e, i) => {
      const globalNo = start + i + 1;
      const isPl = e.type === 'pl';
      const typeBadge = renderTypeCell(e);
      const noindexBadge = (!isPl && e.noindex) ? '<span class="noindex-badge">NOINDEX</span>' : '';
      const nameCell = `<div class="name-cell"><strong>${esc(e.name)}${noindexBadge}</strong><span class="slug">${esc(e.slug)}</span></div>`;

      let actions;
      if (isPl) {
        actions = `
          <a href="/admin/powerlink.html?edit=${encodeURIComponent(e.slug)}">편집</a>
          <a href="${PL_SITE}/powerlink/${encodeURIComponent(e.slug)}/" target="_blank">보기</a>
          <a href="#" class="del" onclick="deletePl('${esc(e.slug)}','${esc(e.name)}');return false;">삭제</a>`;
      } else {
        const domainLinks = DOMAINS.filter(d =>
          (e.createdBy || d.label === 'A') &&
          (d.label !== 'C'  || e.createdBy === 'recovery-manual' || e.createdBy === 'jipjeong-manual') &&
          (d.label !== 'lA' || e.createdBy === 'voicephishing-manual') &&
          (d.label !== 'lC' || e.createdBy === 'tujasagi-manual') &&
          (d.label !== 'lE' || e.createdBy === 'chaemubu-manual')
        ).map(d => `<a href="${d.url}/${d.prefix}/${encodeURIComponent(e.slug)}-${domainSuffix(d.label)}/" target="_blank">${d.label}</a>`).join('');
        const niLabel = e.noindex ? 'noindex 해제' : 'noindex';
        const niStyle = e.noindex ? 'background:#8a96a8' : 'background:#c0392b';
        actions = `
          <a href="/admin/edit.html?slug=${encodeURIComponent(e.slug)}">편집</a>
          <a href="#" onclick="setThumbnail('${esc(e.slug)}');return false;">썸네일</a>
          ${domainLinks}
          <button class="btn sm" style="${niStyle};color:#fff" onclick="toggleNoindex('${esc(e.slug)}',${e.noindex})">${niLabel}</button>
          <button class="btn danger sm" onclick="deleteCase('${esc(e.slug)}','${esc(e.name)}')">삭제</button>`;
      }

      return `<tr id="row-${esc(e.slug)}" data-type="${e.type}">
        <td>${globalNo}</td>
        <td>${typeBadge}</td>
        <td>${nameCell}</td>
        <td>${esc(e.createdAt || '-')}</td>
        <td>${esc(e.updatedAt || '-')}</td>
        <td class="act">${actions}</td>
      </tr>`;
    }).join('');

    renderPagination(filtered);
  }

  function domainSuffix(label) {
    const map = { A:'litigation', B:'settlement', C:'result', D:'review', E:'issue', lA:'legal-action', lB:'recovery', lC:'solution', lD:'report', lE:'incident' };
    return map[label] || '';
  }

  function renderTypeCell(e) {
    if (e.type === 'pl') return '<span class="type-badge tp">파워링크</span>';
    if (e.createdBy) return '<span class="type-badge tc">수동 랜딩</span>';
    const current = e.fraudType || inferFraudType(e);
    const options = FRAUD_TYPE_OPTIONS.map(opt =>
      `<option value="${opt.key}"${opt.key === current ? ' selected' : ''}>${esc(opt.label)}</option>`
    ).join('');
    return `<div class="type-cell">
      <span class="type-badge tc">일반 랜딩</span>
      <select class="type-select" onchange="updateFraudType('${esc(e.slug)}', this.value)">${options}</select>
    </div>`;
  }

  function inferFraudType(e) {
    const text = `${e.slug || ''} ${e.name || ''}`.toLowerCase();
    if (/(refund|hwanbul|bosang|lotto|roddo|toto|proto|환불|보상)/i.test(text)) return 'refund-reward';
    if (/(live|dating|romance|broadcast|hwanjeon|point|casino|라이브|만남|환전)/i.test(text)) return 'live-dating';
    if (/(shop|shopping|mission|review|alba|bueob|market|mart|store|mall|ticket|syoping|gumae|쇼핑|미션|부업|리뷰)/i.test(text)) return 'team-mission';
    if (/(exchange|coin|token|staking|future|futures|hts|mts|ipo|거래소|코인|가상자산|선물)/i.test(text)) return 'institution-exchange';
    return 'stock-project';
  }

  function filterEntries() {
    currentPage = 1;
    const q = document.getElementById('mainSearch').value.trim().toLowerCase();
    filteredEntries = q
      ? allEntries.filter(e => e.name.toLowerCase().includes(q) || e.slug.toLowerCase().includes(q))
      : allEntries;
    renderEntries(filteredEntries);
  }

  /* ---- Actions ---- */
  async function deleteCase(slug, name) {
    if (!confirm(`"${name}" 사건을 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`)) return;
    try {
      const res = await fetch('/api/delete-case', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slug}) });
      const data = await res.json();
      if (data.ok) {
        allEntries = allEntries.filter(e => !(e.type === 'case' && e.slug === slug));
        filterEntries();
        alert(`"${name}" 사건이 삭제되었습니다.`);
      } else { alert('삭제 실패: ' + (data.message || '알 수 없는 오류')); }
    } catch (e) { alert('오류: ' + e.message); }
  }

  async function deletePl(slug, name) {
    if (!confirm(`"${name}" 파워링크 랜딩을 삭제하시겠습니까?`)) return;
    try {
      const res = await fetch('/api/delete-powerlink', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slug}) });
      const data = await res.json();
      if (data.ok) {
        allEntries = allEntries.filter(e => !(e.type === 'pl' && e.slug === slug));
        filterEntries();
        alert(`"${name}" 파워링크 랜딩이 삭제되었습니다.`);
      } else { alert('삭제 실패: ' + (data.message || '알 수 없는 오류')); }
    } catch (e) { alert('오류: ' + e.message); }
  }

  async function setThumbnail(slug) {
    const url = prompt('썸네일 이미지 URL을 입력하세요 (비워두면 삭제):');
    if (url === null) return;
    try {
      const res = await fetch('/api/update-case', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slug, action:'update-thumbnail', value:url.trim()}) });
      const data = await res.json();
      if (data.ok) alert('썸네일이 저장되었습니다. 다음 빌드에 반영됩니다.');
      else alert('저장 실패: ' + (data.message || ''));
    } catch (e) { alert('오류: ' + e.message); }
  }

  async function updateFraudType(slug, value) {
    const entry = allEntries.find(e => e.type === 'case' && e.slug === slug);
    const previous = entry ? entry.fraudType : '';
    try {
      const res = await fetch('/api/update-case', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({slug, action:'set-fraud-type', value})
      });
      const data = await res.json();
      if (data.ok) {
        if (entry) entry.fraudType = value;
        alert('유형 분류가 저장되었습니다. 해당 유형 템플릿 원고로 렌더링됩니다.');
      } else {
        if (entry) entry.fraudType = previous;
        filterEntries();
        alert('저장 실패: ' + (data.message || '알 수 없는 오류'));
      }
    } catch (e) {
      if (entry) entry.fraudType = previous;
      filterEntries();
      alert('오류: ' + e.message);
    }
  }

  async function syncKvToGithub() {
    if (!confirm('KV(서버)의 모든 케이스를 GitHub cases.json으로 덮어씁니다.\n\n계속하시겠습니까?')) return;
    const btn = document.querySelector('[onclick="syncKvToGithub()"]');
    btn.disabled = true; btn.textContent = '동기화 중...';
    try {
      const res = await fetch('/api/sync-kv-to-github', { method:'POST' });
      const data = await res.json();
      if (data.ok) alert(`✅ ${data.message}\n\n총 ${data.total}개 케이스 동기화 완료.\n(인덱스만으로 복원된 케이스: ${data.fromIndexOnly}개)\n\n로컬에서 git pull 하세요.`);
      else alert('❌ 동기화 실패: ' + (data.message || '알 수 없는 오류'));
    } catch (e) { alert('오류: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = 'KV→GitHub 동기화'; }
  }

  async function batchApplyTemplates() {
    if (!confirm('scam-intro/method/example 템플릿을 전체 사건에 일괄 적용하고\nSEO 키워드 밀도를 감소시킵니다.\n계속하시겠습니까?')) return;
    const btn = document.querySelector('button.btn.sec[onclick="batchApplyTemplates()"]');
    btn.disabled = true; btn.textContent = '처리 중...';
    try {
      const res = await fetch('/api/batch-apply-templates', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
      const data = await res.json();
      if (data.ok) alert('완료!\n전체: ' + data.total + '건\nKV 업데이트: ' + data.updatedKV + '건\nGitHub 업데이트: ' + data.githubUpdated + '건' + (data.errors?.length?'\n오류: '+data.errors.length+'건':''));
      else alert('실패: ' + (data.message || '알 수 없는 오류'));
    } catch (e) { alert('오류: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = '템플릿 일괄 적용'; }
  }

  async function toggleNoindex(slug, currentValue) {
    const newValue = !currentValue;
    const label = newValue ? 'noindex로 설정' : 'noindex 해제';
    if (!confirm(`"${slug}" 사건을 ${label}하시겠습니까?`)) return;
    try {
      const res = await fetch('/api/update-case', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slug, action:'set-noindex', value:newValue}) });
      const data = await res.json();
      if (data.ok) {
        const entry = allEntries.find(e => e.type === 'case' && e.slug === slug);
        if (entry) entry.noindex = newValue;
        filterEntries();
      } else { alert('실패: ' + (data.message || '')); }
    } catch (e) { alert('오류: ' + e.message); }
  }

  function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#039;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
