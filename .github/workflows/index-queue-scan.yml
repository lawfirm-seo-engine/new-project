name: Scan search index queue (manual backup)

# 정기 실행은 Cloudflare Cron Trigger(workers/index-queue-cron)가 맡는다.
# 이 워크플로는 필요할 때 수동으로 전체 후보를 한 번에 강제 재스캔하고 싶을 때만
# 쓰는 백업/디버깅용이다.
on:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Scan and enqueue
        env:
          INDEX_QUEUE_TOKEN: ${{ secrets.INDEX_QUEUE_TOKEN }}
        run: node scripts/scan-index-queue.js
