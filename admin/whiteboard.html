<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>화이트보드 영상 생성</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:28px 20px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:24px}.top a{color:#1f4fd8;text-decoration:none;font-weight:700}.panel{background:#fff;border-radius:12px;box-shadow:0 2px 12px #00000012;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}label{display:grid;gap:6px;font-size:13px;font-weight:700}input,select,textarea{width:100%;border:1px solid #cfd8e6;border-radius:8px;padding:10px 12px;font:inherit}.sceneHead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.scene{background:#fff;border:1px solid #e3e9f2;border-radius:12px;padding:16px;margin-bottom:12px}.sceneTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sceneTop strong{font-size:15px}.row{display:grid;grid-template-columns:1fr 120px;gap:10px;margin-bottom:10px}.actions{display:flex;gap:6px}.btn{border:0;border-radius:7px;background:#1f4fd8;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.btn.sec{background:#263244}.btn.light{background:#eef2f8;color:#263244}.btn.danger{background:#c0392b}.footer{position:sticky;bottom:12px;background:#ffffffee;backdrop-filter:blur(6px);border:1px solid #dde4ee;border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center}.status{font-size:13px;color:#66748a}.notice{font-size:13px;line-height:1.7;color:#536074;background:#eef4ff;border-left:4px solid #1f4fd8;padding:12px 14px;border-radius:8px}.brand{color:#8c1d18;font-weight:800}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head><body><main class="wrap">
<div class="top"><div><h1>화이트보드 영상 생성</h1><div class="status">법무법인 선린 · SRT Whiteboard Animation</div></div><a href="/admin/dashboard">← 관리자 대시보드</a></div>
<div class="panel"><div class="grid"><label>영상 제목<input id="title" value="주식리딩방 사기"></label><label>영상 길이<select id="duration"><option value="30">30초</option><option value="45">45초</option><option value="60">60초</option></select></label><label>화면비<select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option></select></label></div></div>
<div class="notice"><span class="brand">선린 기본 설정</span> · 미색 종이 배경, 원본 drawing-hand.png의 펜을 쥔 손, ink → color 스트림 드로잉, 마지막 장면은 “지금 바로 법무법인 선린 사기피해 특화 전문 TF팀에 상담 받으세요”를 기본으로 사용합니다.</div>
<div class="sceneHead"><div><strong>장면 구성</strong><div class="status">내레이션과 화면 상황을 자유롭게 수정하세요.</div></div><button class="btn light" id="add">+ 장면 추가</button></div>
<div id="scenes"></div>
<div class="footer"><button class="btn" id="export">렌더 프로젝트 파일 만들기</button><button class="btn sec" id="reset">주식리딩방 기본 장면</button><span class="status" id="status">대기 중</span></div>
</main>
<template id="sceneTpl"><section class="scene"><div class="sceneTop"><strong class="num"></strong><div class="actions"><button class="btn light up">↑</button><button class="btn light down">↓</button><button class="btn danger del">삭제</button></div></div><div class="row"><label>역할<input class="role"></label><label>시간 가중치<input class="weight" type="number" min="0.1" step="0.1" value="1"></label></div><label>내레이션<textarea class="narration" rows="2"></textarea></label><label>그림 상황 설명<textarea class="visual" rows="3"></textarea></label></section></template>
<script>
const defaultScenes=[
{role:'hook',weight:1,narration:'주식리딩방, 정말 믿어도 될까요?',visual:'휴대폰에서 고수익 투자 메시지를 본 직장인, 주식 차트와 수상한 채팅 알림'},
{role:'approach',weight:1.1,narration:'SNS와 메신저에서 투자 전문가나 증권사 관계자를 사칭해 접근합니다.',visual:'SNS 프로필과 메신저 대화창, 투자 전문가를 사칭한 인물이 리딩방 초대 링크를 보내는 장면'},
{role:'trust',weight:1,narration:'높은 수익률과 다른 투자자의 성공 인증으로 신뢰를 쌓습니다.',visual:'높은 수익률 화면, 가짜 성공 인증, 상승 그래프를 바라보는 투자자'},
{role:'deposit',weight:1.1,narration:'특별 종목과 비공개 정보를 강조하며 더 큰 입금을 요구합니다.',visual:'VIP 종목이라는 말과 함께 계좌에서 투자 앱으로 돈이 이동하는 장면'},
{role:'fake-profit',weight:1,narration:'화면에는 수익이 계속 늘어나는 것처럼 표시됩니다.',visual:'가짜 거래 화면에서 수익 숫자가 커지고 안심하는 투자자'},
{role:'withdrawal',weight:1.2,narration:'출금을 요청하면 세금, 보증금, 인증비 같은 추가 입금을 요구합니다.',visual:'출금 버튼이 잠기고 세금, 보증금, 인증비 아이콘이 나타나는 장면'},
{role:'warning',weight:.9,narration:'출금이 막힌 상태에서 추가 송금을 반복해서는 안 됩니다.',visual:'송금 직전 손을 멈추게 하는 STOP 표시와 잠긴 투자 플랫폼'},
{role:'cta',weight:1.4,narration:'피해가 의심된다면 지금 바로 법무법인 선린 사기피해 특화 전문 TF팀에 상담 받으세요.',visual:'피해자가 휴대폰과 이체 자료를 들고 법률 대응 TF팀과 상담하는 장면'}];
const $=s=>document.querySelector(s),box=$('#scenes'),tpl=$('#sceneTpl');
function renumber(){[...box.children].forEach((e,i)=>e.querySelector('.num').textContent=`SCENE ${String(i+1).padStart(2,'0')}`)}
function add(d={role:'custom',weight:1,narration:'',visual:''}){const e=tpl.content.firstElementChild.cloneNode(true);e.querySelector('.role').value=d.role;e.querySelector('.weight').value=d.weight;e.querySelector('.narration').value=d.narration;e.querySelector('.visual').value=d.visual;e.querySelector('.del').onclick=()=>{e.remove();renumber()};e.querySelector('.up').onclick=()=>{if(e.previousElementSibling)box.insertBefore(e,e.previousElementSibling);renumber()};e.querySelector('.down').onclick=()=>{if(e.nextElementSibling)box.insertBefore(e.nextElementSibling,e);renumber()};box.appendChild(e);renumber()}
function reset(){box.innerHTML='';defaultScenes.forEach(add)}
function srtTime(ms){const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000),x=ms%1000;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(x).padStart(3,'0')}`}
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#add').onclick=()=>add();$('#reset').onclick=reset;
$('#export').onclick=()=>{const cards=[...box.children];if(!cards.length)return alert('장면을 추가하세요.');const scenes=cards.map((c,i)=>({index:i+1,role:c.querySelector('.role').value.trim(),weight:Number(c.querySelector('.weight').value)||1,narration:c.querySelector('.narration').value.trim(),visual:c.querySelector('.visual').value.trim()}));if(scenes.some(s=>!s.narration||!s.visual))return alert('모든 장면의 내레이션과 그림 상황을 입력하세요.');const total=Number($('#duration').value)*1000,sum=scenes.reduce((a,s)=>a+s.weight,0);let cur=0,srt=[],prompts=[];scenes.forEach((s,i)=>{const end=i===scenes.length-1?total:Math.round(cur+total*s.weight/sum);s.startMs=cur;s.endMs=end;s.durationMs=end-cur;srt.push(String(i+1),`${srtTime(cur)} --> ${srtTime(end)}`,s.narration,'');prompts.push(`SCENE ${String(i+1).padStart(2,'0')}\nWhiteboard hand-drawn illustration. ${s.visual}. Warm cream paper #F5EBD7, dark gray ink, minimal red blue orange accents, no embedded text, clean drawable contours, leave top-right safe area for Sunrin logo.`);cur=end});const project={title:$('#title').value.trim(),durationMs:total,aspect:$('#aspect').value,brand:{name:'법무법인 선린',canvasColor:'#F5EBD7',handAsset:'assets/drawing-hand.png',renderer:'scripts/render_stream_whiteboard.py',finalCta:'지금 바로 법무법인 선린 사기피해 특화 전문 TF팀에 상담 받으세요'},scenes};download('project.json',JSON.stringify(project,null,2),'application/json');download('script.srt',srt.join('\n'));download('image-prompts.txt',prompts.join('\n\n'));$('#status').textContent='project.json · script.srt · image-prompts.txt 생성 완료';};reset();
</script></body></html>
