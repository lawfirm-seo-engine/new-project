<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>화이트보드 영상 생성</title><link rel="stylesheet" href="/admin/whiteboard-presets.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fb;color:#172033}.wrap{max-width:1180px;margin:auto;padding:28px 20px 80px}.top,.sceneHead,.footer{display:flex;justify-content:space-between;align-items:center;gap:14px}.top{margin-bottom:22px}.top h1{margin:0;font-size:24px}.top a{color:#1f4fd8;text-decoration:none;font-weight:700}.panel{background:#fff;border-radius:12px;box-shadow:0 2px 12px #00000012;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}label{display:grid;gap:6px;font-size:13px;font-weight:700}input,select,textarea{width:100%;border:1px solid #cfd8e6;border-radius:8px;padding:10px 12px;font:inherit}.notice{font-size:13px;line-height:1.7;color:#536074;background:#eef4ff;border-left:4px solid #1f4fd8;padding:12px 14px;border-radius:8px}.brand{color:#8c1d18;font-weight:800}.sceneHead{margin:24px 0 10px}.scene{background:#fff;border:1px solid #e3e9f2;border-radius:12px;padding:16px;margin-bottom:12px}.sceneTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sceneBody{display:grid;grid-template-columns:230px 1fr;gap:16px}.scenePreview,.whiteboard-scene-preview{border:1px solid #dfe6ef;border-radius:10px;overflow:hidden;background:#f7f2e8;min-height:190px}.scenePreview img,.whiteboard-scene-preview img{display:block;width:100%;height:100%;min-height:190px;object-fit:contain}.row{display:grid;grid-template-columns:1fr 120px;gap:10px;margin-bottom:10px}.actions,.buttons{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:7px;background:#1f4fd8;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.45}.btn.light{background:#eef2f8;color:#263244}.btn.danger{background:#c0392b}.btn.red{background:#8c1d18}.big{font-size:17px;padding:14px 28px}.status{font-size:13px;color:#66748a}.pipeline{text-align:center;margin-top:28px}.flow{font-weight:800;margin:4px 0 18px}.media{margin-top:16px;background:#18202b;border-radius:12px;padding:14px;display:none}.media video{display:block;width:100%;max-height:580px;background:#000;border-radius:8px}.footer{position:sticky;bottom:12px;background:#ffffffee;border:1px solid #dde4ee;border-radius:12px;padding:14px;margin-top:18px;justify-content:flex-start}@media(max-width:850px){.sceneBody{grid-template-columns:1fr}.grid,.row{grid-template-columns:1fr}.top,.sceneHead{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>화이트보드 영상 생성</h1><div class="status">법무법인 선린 · 인스타그램용 로컬 MP4 생성</div></div><a href="/admin/dashboard">← 관리자 대시보드</a></div><div class="panel"><div class="grid"><label>영상 제목(사건명)<input id="title" value="주식리딩방 사기"></label><label>영상 길이<select id="duration"><option value="15" selected>15초</option><option value="30">30초</option><option value="45">45초</option><option value="60">60초</option></select></label><label>화면비<select id="aspect"><option>16:9</option><option selected>9:16</option><option>1:1</option></select></label></div></div><div class="notice"><span class="brand">기본 이미지 10종</span> · 사건명은 01번 이미지 하단에 자동 입력됩니다. 결과 영상은 브라우저에서 생성되어 로컬 PC에만 저장됩니다.</div><div class="sceneHead"><div><strong>장면 구성</strong><div class="status">stock_card_01.png ~ stock_card_10.png</div></div></div><div id="scenes"></div><section class="pipeline panel"><div class="flow">기본 PNG → 영상 스타일 → H.264 MP4 → 로컬 PC 저장</div><button class="btn red big" id="generate">영상 바로 생성</button><p class="status" id="jobText">기본 이미지 10종 · 로컬 생성</p><p class="status" id="status">대기 중</p><div class="media" id="media"><video id="video" controls playsinline></video><div class="buttons" style="margin-top:10px"><a class="btn" id="videoLink">영상 다시 다운로드</a></div></div></section><div class="footer"><button class="btn light" id="reset">기본 이미지 10종으로 초기화</button></div></main><template id="sceneTpl"><section class="scene"><div class="sceneTop"><strong class="num"></strong><div class="actions"><button class="btn light up">↑</button><button class="btn light down">↓</button><button class="btn danger del">삭제</button></div></div><div class="sceneBody"><div class="scenePreview"><img class="preview" alt="장면 이미지"></div><div><div class="row"><label>역할<input class="role"></label><label>시간 가중치<input class="weight" type="number" min="0.1" step="0.1" value="1"></label></div><label>내레이션<textarea class="narration" rows="2"></textarea></label><label>그림 상황 설명<textarea class="visual" rows="2"></textarea></label></div></div></section></template><script src="/admin/whiteboard-presets.js?v=20260902-3"></script></body></html>
