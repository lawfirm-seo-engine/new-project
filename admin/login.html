<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인</title>
</head>
<body>
  <h1>관리자 로그인</h1>

  <form id="loginForm">
    <input id="adminId" type="text" placeholder="관리자 ID" required />
    <input id="adminPw" type="password" placeholder="비밀번호" required />
    <button type="submit">로그인</button>
  </form>

  <p id="message"></p>

<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const messageEl = document.getElementById("message");
    messageEl.textContent = "로그인 확인 중...";

    const id = document.getElementById("adminId").value.trim();
    const pw = document.getElementById("adminPw").value;

    try {
      const res = await fetch("/admin/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ id, pw })
      });

      const text = await res.text();

      let data;
      try {
        data = JSON.parse(text);
      } catch {
        messageEl.textContent = "서버 응답이 JSON이 아닙니다: " + text.slice(0, 200);
        return;
      }

      if (data.ok) {
        location.href = "/admin/dashboard.html";
      } else {
        messageEl.textContent = data.message || "로그인 실패";
      }
    } catch (err) {
      messageEl.textContent = "요청 오류: " + err.message;
    }
  });
</script>
</body>
</html>
