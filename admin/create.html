<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사건 생성</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
      max-width: 1120px;
      margin: 0 auto;
      color: #172033;
      background: #f6f8fb;
    }

    form,
    .panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      background: #fff;
      border: 1px solid #dde3ee;
      border-radius: 8px;
    }

    input,
    textarea,
    button {
      padding: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      font-family: Consolas, monospace;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #1f4fd8;
      color: #fff;
      font-weight: 700;
    }

    button.secondary {
      background: #263244;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .panel {
      margin-top: 20px;
      display: none;
    }

    .panel.is-visible {
      display: flex;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      background: #edf7ed;
      color: #145b22;
      white-space: pre-wrap;
    }

    .status.warning {
      background: #fff7e0;
      color: #714900;
    }

    .status.blocked {
      background: #ffe8e8;
      color: #8a1f1f;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #dde3ee;
      padding-bottom: 12px;
    }

    .tab-button {
      background: #edf1f7;
      color: #263244;
      padding: 10px 14px;
      border: 1px solid #d7deea;
    }

    .tab-button.is-active {
      background: #1f4fd8;
      color: #fff;
      border-color: #1f4fd8;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      padding: 14px;
      border: 1px solid #e1e6ef;
      border-radius: 6px;
      background: #fafbfd;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field strong {
      display: block;
      margin-bottom: 8px;
      color: #4b5a70;
      font-size: 13px;
    }

    .field p,
    .field ul,
    .field pre {
      margin: 0;
    }

    .field ul {
      padding-left: 20px;
    }

    .field pre {
      overflow: auto;
      max-height: 260px;
      white-space: pre-wrap;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      body {
        padding: 20px;
      }

      .actions,
      .preview-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>사건 생성</h1>

  <form id="createForm">
    <input id="caseName" type="text" placeholder="사건명" required />

    <div class="actions">
      <button id="generateDraftButton" class="secondary" type="button">
        AI 원고 생성
      </button>

      <button id="submitButton" type="submit" disabled>
        사건 생성
      </button>
    </div>

    <input id="slug" type="text" placeholder="slug" readonly required />
    <input id="category" type="text" placeholder="카테고리" readonly required />
    <textarea id="summary" placeholder="요약" readonly required></textarea>
  </form>

  <section id="reviewPanel" class="panel" aria-live="polite">
    <strong>AI 데이터 검수 결과</strong>
    <div id="reviewStatus" class="status"></div>

    <div id="previewTabs" class="tabs" role="tablist" aria-label="도메인별 원고 미리보기"></div>
    <div id="landingPreview" class="preview-grid"></div>

    <textarea id="generatedData" readonly></textarea>
  </section>

  <p id="message"></p>

  <script>
    const GROUPS = [
      { key: "a", label: "A 형사고소형" },
      { key: "b", label: "B 민사소송형" },
      { key: "c", label: "C 성공사례형" },
      { key: "d", label: "D 정보형" },
      { key: "e", label: "E 전체허브형" },
    ];

    const caseNameEl = document.getElementById("caseName");
    const slugEl = document.getElementById("slug");
    const categoryEl = document.getElementById("category");
    const summaryEl = document.getElementById("summary");
    const messageEl = document.getElementById("message");
    const reviewPanelEl = document.getElementById("reviewPanel");
    const reviewStatusEl = document.getElementById("reviewStatus");
    const generatedDataEl = document.getElementById("generatedData");
    const previewTabsEl = document.getElementById("previewTabs");
    const landingPreviewEl = document.getElementById("landingPreview");
    const generateDraftButtonEl = document.getElementById("generateDraftButton");
    const submitButtonEl = document.getElementById("submitButton");

    let generatedCase = null;
    let activePreviewKey = "a";

    function resetGeneratedData() {
      generatedCase = null;
      submitButtonEl.disabled = true;
      reviewPanelEl.classList.remove("is-visible");
      reviewStatusEl.textContent = "";
      generatedDataEl.value = "";
      previewTabsEl.innerHTML = "";
      landingPreviewEl.innerHTML = "";
      slugEl.value = "";
      categoryEl.value = "";
      summaryEl.value = "";
    }

    function renderGeneratedData(data) {
      generatedCase = data.case;
      slugEl.value = generatedCase.slug;
      categoryEl.value = generatedCase.category;
      summaryEl.value = generatedCase.summary;

      const status = data.review.status;
      reviewPanelEl.classList.add("is-visible");
      reviewStatusEl.className = `status ${status}`;
      const sourceLabels = {
        "openai": "✅ OpenAI GPT-4o-mini 원고 생성 완료",
        "no-key": "⚠️ 기본 규칙 기반 원고 — OPENAI_API_KEY 환경변수가 Functions에 전달되지 않음",
        "openai-error": "❌ OpenAI 호출 오류 — 검수 노트에서 에러 메시지 확인",
        "rule-based": "⚠️ 기본 규칙 기반 원고",
      };
      const sourceLabel = sourceLabels[data.review.source] || "⚠️ 기본 규칙 기반 원고";
      reviewStatusEl.textContent = [
        sourceLabel,
        status === "blocked"
          ? "저장 차단: 동일 또는 매우 유사한 사건이 있습니다."
          : status === "warning"
            ? "주의: 유사 사건이 있습니다. 기존 사건과 별도인지 확인하세요."
            : "통과: 중복 위험이 낮습니다.",
        data.review.categoryReason,
        ...(data.review.notes || []),
        ...(data.review.duplicateCheck.matches || []).map((item) => `유사 후보: ${item.caseName || item.slug} / ${item.slug} / ${Math.round(item.score * 100)}%`),
      ].join("\n");

      activePreviewKey = "a";
      renderPreviewTabs();
      renderLandingPreview(activePreviewKey);

      generatedDataEl.value = JSON.stringify({
        savedFields: [
          "title",
          "description",
          "canonical",
          "ogTitle",
          "ogDescription",
          "ogImage",
          "h1",
          "body",
          "victimCases",
          "suspiciousCompanies",
          "faq",
          "schema",
        ],
        case: generatedCase,
      }, null, 2);

      submitButtonEl.disabled = status === "blocked";
    }

    function renderPreviewTabs() {
      previewTabsEl.innerHTML = "";

      for (const group of GROUPS) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `tab-button${group.key === activePreviewKey ? " is-active" : ""}`;
        button.textContent = group.label;
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", String(group.key === activePreviewKey));
        button.addEventListener("click", () => {
          activePreviewKey = group.key;
          renderPreviewTabs();
          renderLandingPreview(group.key);
        });
        previewTabsEl.appendChild(button);
      }
    }

    function renderLandingPreview(key) {
      const landing = generatedCase?.landings?.[key];

      if (!landing) {
        landingPreviewEl.innerHTML = "";
        return;
      }

      landingPreviewEl.innerHTML = "";
      landingPreviewEl.append(
        createTextField("title", landing.title),
        createTextField("description", landing.description),
        createTextField("canonical", landing.canonical),
        createTextField("OG title", landing.ogTitle),
        createTextField("OG description", landing.ogDescription),
        createTextField("OG image", landing.ogImage),
        createTextField("H1", landing.h1),
        createListField("본문 원고", landing.body, true),
        createListField("피해사례", landing.victimCases, true),
        createListField("사기 의심 업체 리스트", landing.suspiciousCompanies, true),
        createFaqField("FAQ", landing.faq),
        createCodeField("schema JSON-LD", landing.schema)
      );
    }

    function createTextField(label, value) {
      const field = createField(label);
      const paragraph = document.createElement("p");
      paragraph.textContent = value || "";
      field.appendChild(paragraph);
      return field;
    }

    function createListField(label, values, wide) {
      const field = createField(label, wide);
      const list = document.createElement("ul");

      for (const value of values || []) {
        const item = document.createElement("li");
        item.textContent = value;
        list.appendChild(item);
      }

      field.appendChild(list);
      return field;
    }

    function createFaqField(label, values) {
      const field = createField(label, true);
      const list = document.createElement("ul");

      for (const value of values || []) {
        const item = document.createElement("li");
        item.textContent = `${value.question} ${value.answer}`;
        list.appendChild(item);
      }

      field.appendChild(list);
      return field;
    }

    function createCodeField(label, value) {
      const field = createField(label, true);
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(value || {}, null, 2);
      field.appendChild(pre);
      return field;
    }

    function createField(label, wide = false) {
      const field = document.createElement("div");
      field.className = `field${wide ? " wide" : ""}`;
      const title = document.createElement("strong");
      title.textContent = label;
      field.appendChild(title);
      return field;
    }

    caseNameEl.addEventListener("input", resetGeneratedData);

    generateDraftButtonEl.addEventListener("click", async () => {
      const caseName = caseNameEl.value.trim().replace(/\s+/g, " ");

      if (!caseName) {
        messageEl.textContent = "사건명을 먼저 입력해주세요.";
        return;
      }

      messageEl.textContent = "AI 데이터 생성 및 중복 검수 중...";
      generateDraftButtonEl.disabled = true;

      try {
        const res = await fetch("/api/generate-draft", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ caseName }),
        });
        const data = await res.json();

        if (!data.ok) {
          messageEl.textContent = data.message || "AI 데이터 생성에 실패했습니다.";
          return;
        }

        renderGeneratedData(data);
        messageEl.textContent = "AI 데이터 생성 완료. 도메인별 원고를 확인한 뒤 사건 생성을 진행하세요.";
      } catch (error) {
        messageEl.textContent = `AI 데이터 생성 오류: ${error.message}`;
      } finally {
        generateDraftButtonEl.disabled = false;
      }
    });

    document.getElementById("createForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!generatedCase) {
        messageEl.textContent = "먼저 AI 원고 생성을 실행해주세요.";
        return;
      }

      messageEl.textContent = "사건 저장 중...";
      submitButtonEl.disabled = true;

      const res = await fetch("/api/create-case", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(generatedCase),
      });
      const data = await res.json();

      if (data.ok) {
        messageEl.textContent = "사건 저장 완료. 정적 HTML은 배포 생성 단계에서 출력됩니다.";
      } else {
        messageEl.textContent = JSON.stringify(data, null, 2);
        submitButtonEl.disabled = false;
      }
    });
  </script>

</body>
</html>
