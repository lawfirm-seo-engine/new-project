<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fb;color:#172033}
    .wrap{max-width:1100px;margin:0 auto;padding:32px 20px}
    h1{margin:0 0 6px;font-size:24px}
    .top-nav{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;height:40px;padding:0 18px;border:0;border-radius:7px;background:#1f4fd8;color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
    .btn.sec{background:#263244}
    .btn.danger{background:#c0392b}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.06)}
    th,td{padding:13px 16px;text-align:left;font-size:14px;border-bottom:1px solid #e8edf4}
    th{background:#f0f4fa;font-weight:800;color:#4b5a70}
    tr:last-child td{border-bottom:0}
    tr:hover td{background:#f8faff}
    .badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:800;background:#e8f0fe;color:#1f4fd8}
    .act a{margin-right:8px;color:#1f4fd8;font-weight:700;text-decoration:none;font-size:13px}
    .loading{text-align:center;padding:40px;color:#8a96a8}
    .meta{color:#8a96a8;font-size:13px;margin:0 0 20px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>관리자 대시보드</h1>
  <p class="meta" id="caseCount">사건 로딩 중...</p>
  <div class="top-nav">
    <a class="btn" href="/admin/create.html">+ 새 사건 생성</a>
    <a class="btn" href="/admin/powerlink.html">+ 파워링크 랜딩 생성</a>
    <button class="btn sec" onclick="syncKvToGithub()">KV→GitHub 동기화</button>
    <button class="btn sec" onclick="batchApplyTemplates()">템플릿 일괄 적용</button>
    <a class="btn sec" href="/admin/settings.html">텔레그램 설정</a>
    <a class="btn sec" href="/admin/logout">로그아웃</a>
  </div>
  <table>
    <thead>
      <tr>
        <th>No.</th><th>사건명</th><th>등록일</th><th>수정일</th><th>관리</th>
      </tr>
    </thead>
    <tbody id="tbody"><tr><td colspan="5" class="loading">로딩 중...</td></tr></tbody>
  </table>
</div>
<script>
  const DOMAINS = [
    { label:'A',  url:'https://gnlaw-criminal.co.kr', prefix:'prosecute' },
    { label:'B',  url:'https://gnlaw-civil.co.kr',   prefix:'civil' },
    { label:'C',  url:'https://gnlaw-recovery.co.kr',   prefix:'success' },
    { label:'D',  url:'https://gnlaw-case.co.kr',   prefix:'briefing' },
    { label:'E',  url:'https://gnlaw-center.co.kr',   prefix:'case' },
    { label:'lA', url:'https://금융사기대응센터.kr',           prefix:'prosecute' },
    { label:'lB', url:'https://금융피해대응센터.kr',           prefix:'civil' },
    { label:'lC', url:'https://사기피해구제센터.kr',           prefix:'success' },
    { label:'lD', url:'https://리딩방피해회수센터.kr',           prefix:'briefing' },
    { label:'lE', url:'https://투자사기대응센터.kr',           prefix:'case' },
  ];

  fetch('/api/get-cases')
    .then(r => r.json())
    .then(data => {
      if (!data.ok) { document.getElementById('tbody').innerHTML = `<tr><td colspan="5" style="color:#c0392b">불러오기 실패: ${data.message || '알 수 없는 오류'}</td></tr>`; return; }
      const cases = data.cases;
      document.getElementById('caseCount').textContent = `총 ${cases.length}건`;
      const sorted = [...cases].sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
      document.getElementById('caseCount').textContent = `총 ${sorted.length}건`;
      document.getElementById('tbody').innerHTML = sorted.map((c, i) => `
        <tr id="row-${esc(c.slug)}">
          <td>${sorted.length - i}</td>
          <td><strong>${esc(c.caseName)}</strong>${c.memo ? ' <span style="color:#8a96a8;font-size:12px">📝</span>' : ''}</td>
          <td>${esc(c.createdAt||'-')}</td>
          <td>${esc(c.updatedAt||'-')}</td>
          <td class="act">
            <a href="/admin/edit.html?slug=${encodeURIComponent(c.slug)}">편집</a>
            <a href="#" onclick="setThumbnail('${esc(c.slug)}');return false;">썸네일</a>
            ${DOMAINS.map(d=>`<a href="${d.url}/${d.prefix}/${encodeURIComponent(c.slug)}/" target="_blank">${d.label}</a>`).join('')}
            <button class="btn danger" style="padding:0 10px;height:30px;font-size:12px" onclick="deleteCase('${esc(c.slug)}','${esc(c.caseName)}')">삭제</button>
          </td>
        </tr>`).join('');
    })
    .catch(() => { document.getElementById('tbody').innerHTML = '<tr><td colspan="5">로딩 오류</td></tr>'; });

  async function deleteCase(slug, name) {
    if (!confirm(`"${name}" 사건을 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`)) return;
    try {
      const res = await fetch('/api/delete-case', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug }),
      });
      const data = await res.json();
      if (data.ok) {
        const row = document.getElementById('row-' + slug);
        if (row) row.remove();
        alert(`"${name}" 사건이 삭제되었습니다.`);
      } else {
        alert('삭제 실패: ' + (data.message || '알 수 없는 오류'));
      }
    } catch (e) {
      alert('오류: ' + e.message);
    }
  }

  async function setThumbnail(slug) {
    const url = prompt('썸네일 이미지 URL을 입력하세요 (비워두면 삭제):');
    if (url === null) return;
    try {
      const res = await fetch('/api/update-case', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug, action: 'update-thumbnail', value: url.trim() }),
      });
      const data = await res.json();
      if (data.ok) alert('썸네일이 저장되었습니다. 다음 빌드에 반영됩니다.');
      else alert('저장 실패: ' + (data.message || ''));
    } catch (e) { alert('오류: ' + e.message); }
  }

  async function syncKvToGithub() {
    if (!confirm('KV(서버)의 모든 케이스를 GitHub cases.json으로 덮어씁니다.\n\n계속하시겠습니까?')) return;
    const btn = document.querySelector('[onclick="syncKvToGithub()"]');
    btn.disabled = true; btn.textContent = '동기화 중...';
    try {
      const res = await fetch('/api/sync-kv-to-github', { method: 'POST' });
      const data = await res.json();
      if (data.ok) {
        alert(`✅ ${data.message}\n\n총 ${data.total}개 케이스 동기화 완료.\n(인덱스만으로 복원된 케이스: ${data.fromIndexOnly}개)\n\n로컬에서 git pull 하세요.`);
      } else {
        alert('❌ 동기화 실패: ' + (data.message || '알 수 없는 오류'));
      }
    } catch (e) {
      alert('오류: ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = 'KV→GitHub 동기화';
    }
  }

  async function batchApplyTemplates() {
    if (!confirm('scam-intro/method/example 템플릿을 전체 사건에 일괄 적용하고\nSEO 키워드 밀도를 감소시킵니다.\n계속하시겠습니까?')) return;
    const btn = document.querySelector('button.btn.sec[onclick="batchApplyTemplates()"]');
    btn.disabled = true; btn.textContent = '처리 중...';
    try {
      const res = await fetch('/api/batch-apply-templates', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const data = await res.json();
      if (data.ok) {
        alert('완료!\n전체: ' + data.total + '건\nKV 업데이트: ' + data.updatedKV + '건\nGitHub 업데이트: ' + data.githubUpdated + '건' + (data.errors?.length ? '\n오류: ' + data.errors.length + '건' : ''));
      } else {
        alert('실패: ' + (data.message || '알 수 없는 오류'));
      }
    } catch (e) { alert('오류: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = '템플릿 일괄 적용'; }
  }

  function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#039;');
  }
</script>
</body>
</html>
