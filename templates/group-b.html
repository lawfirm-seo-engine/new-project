<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{ogDescription}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:locale" content="ko_KR">
  {{headExtra}}
  <script type="application/ld+json">{{schema}}</script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="{{bodyClass}} {{pageKind}}">
  <header class="site-header">
    <a class="brand" href="/" aria-label="대온 법률사무소 홈">
      <img src="/assets/logo.png" alt="대온 법률사무소">
    </a>
    <a class="header-call" href="#consult">회수 문의</a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">{{tone}}</p>
      <h1>{{h1}}</h1>
      <p class="summary">{{summary}}</p>
    </section>

    <div class="page-shell">
      {{content}}
    </div>

    <section id="consult" class="cta">
      <p class="eyebrow">{{intent}}</p>
      <h2>{{ctaTitle}}</h2>
      <p>{{ctaText}}</p>
      <a href="tel:0269523695">{{ctaLabel}}</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="/assets/logo.png" alt="대온 법률사무소">
      </div>
      <nav class="footer-nav" aria-label="카테고리 바로가기">{{footerLinks}}</nav>
      <address class="footer-info">
        <span>대표변호사 : 신동우</span>
        <span>주소 : 서울 서초구 서초대로 250 스타갤러리브릿지빌딩 802호</span>
        <span>전화번호 : <a href="tel:0269523695">02-6952-3695</a></span>
        <span>이메일 : <a href="mailto:noleosi@daeonlaw.co.kr">noleosi@daeonlaw.co.kr</a></span>
      </address>
      <p class="copyright">COPYRIGHT © 2024 대온 법률사무소 All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
