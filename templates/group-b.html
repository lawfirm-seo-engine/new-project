<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{ogDescription}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:locale" content="ko_KR">
  {{headExtra}}
  <script type="application/ld+json">{{schema}}</script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="{{bodyClass}} {{pageKind}}">
  <header class="site-header">
    <a class="brand" href="/"><span>{{shortName}}</span>{{siteName}}</a>
    <nav class="site-nav" aria-label="검색 의도별 바로가기">{{navLinks}}</nav>
    <a class="header-call" href="#consult">회수 문의</a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">{{tone}}</p>
      <h1>{{h1}}</h1>
      <p class="summary">{{summary}}</p>
    </section>

    <div class="page-shell">
      {{content}}
    </div>

    <section id="consult" class="cta">
      <p class="eyebrow">{{intent}}</p>
      <h2>{{ctaTitle}}</h2>
      <p>{{ctaText}}</p>
      <a href="tel:01000000000">{{ctaLabel}}</a>
    </section>
  </main>
</body>
</html>
